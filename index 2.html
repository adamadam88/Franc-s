{id:"11.1", t:"Día 1 · Repaso: artículos y preposiciones", html:`
<ul><li><b>Artículos:</b> le / la / l' / les · un / une / des · du / de la / de l' (partitivo) · <b>de</b> tras negación y cantidades.</li>
<li><b>Contracciones:</b> au, aux, du, des.</li>
<li><b>Ciudades y países:</b> <i>à Paris</i> · <i>en France, en Espagne</i> (femeninos) · <i>au Canada, au Maroc</i> (masculinos) · <i>aux États-Unis</i> (plural).</li>
<li><b>Lugares:</b> <i>chez</i> + persona (<i>chez moi, chez le médecin</i>), <i>dans</i> (dentro), <i>sur</i> (sobre), <i>sous</i> (debajo), <i>devant / derrière</i>, <i>à côté de</i>, <i>en face de</i>.</li>
<li><b>Tiempo:</b> <i>depuis</i> (desde / desde hace), <i>il y a</i> (hace), <i>pendant</i> (durante), <i>dans</i> (dentro de: <i>dans deux jours</i>).</li></ul>`,
ex:[["Je bois ___ café. (partitivo)",["du"]],["Je ne mange pas ___ pain.",["de"]],["Je vais ___ Canada.",["au"]],["J'habite ___ Espagne.",["en"]],["Je vais ___ États-Unis.",["aux"]],["Je dors ___ ma copine. (en casa de)",["chez"]],["J'apprends le français ___ octobre. (desde)",["depuis"]],["Je pars ___ deux jours. (dentro de)",["dans"]],["Je suis arrivée ___ trois jours. (hace)",["il y a"]],["J'ai dormi ___ le film. (durante)",["pendant"]]],
prod:"Describe dónde está cada cosa en tu casa y adónde has viajado, con preposiciones."},

{id:"11.2", t:"Día 2 · Repaso: los irregulares del presente", html:`
<p>Los 20 verbos que más vas a usar. Léelos en voz alta:</p>
<p><i>je suis, j'ai, je vais, je fais, je viens, je dis, je peux, je veux, je dois, je sais, je vois, je prends, je mets, je pars, je sors, je dors, je lis, j'écris, je bois, je connais</i>.</p>
<p><b>Las formas de nous y vous más traicioneras:</b> <i>vous êtes, vous faites, vous dites</i> (¡no «faisez» ni «disez»!) · <i>nous buvons</i> · <i>ils font, ils vont, ils sont, ils ont</i>.</p>
<p><b>Verbos con cambio de acento o letra:</b> <i>j'achète, je préfère, j'appelle, je paie, nous mangeons, nous commençons</i>.</p>`,
ex:[["Vous ___ quoi ? (faire)",["faites"]],["Vous ___ la vérité ? (dire)",["dites"]],["Vous ___ fatigués ? (être)",["êtes"]],["Nous ___ de l'eau. (boire)",["buvons"]],["Ils ___ à la plage. (aller)",["vont"]],["J'___ une robe. (acheter)",["achète"]],["Je t'___ ce soir. (appeler)",["appelle"]],["Nous ___ à neuf heures. (commencer)",["commençons"]],["Nous ___ ensemble. (manger)",["mangeons"]],["Ils ___ une maison. (avoir)",["ont"]]],
prod:"Escribe 10 frases verdaderas sobre ti con 10 verbos irregulares distintos."},

{id:"11.3", t:"Día 3 · Repaso: hablar del pasado", html:`
<p>Último repaso del pasado. Lee el texto y fíjate en cada tiempo:</p>
<p><i>L'été dernier, je <b>suis partie</b> en Thaïlande pour m'entraîner. Il <b>faisait</b> très chaud et le camp <b>était</b> au milieu de la jungle. Tous les matins, on <b>courait</b> à six heures. Le troisième jour, je me <b>suis blessée</b> au genou, mais mon entraîneur m'<b>a aidée</b> et j'<b>ai pu</b> continuer. Le dernier soir, j'<b>ai fait</b> mon premier combat là-bas. J'<b>étais</b> morte de peur, mais j'<b>ai gagné</b> !</i></p>
<p>Fíjate en <i>m'a aidée</i>: con <i>avoir</i> y un pronombre COD femenino delante, el participio concuerda.</p>`,
ex:[["L'été dernier, je ___ partie. (auxiliar)",["suis"]],["Il ___ très chaud. (faire, imparfait)",["faisait"]],["Tous les matins, on ___ . (courir, imparfait)",["courait"]],["Je me ___ blessée. (auxiliar)",["suis"]],["Mon entraîneur m'a ___ . (aider, concordancia fem.)",["aidée"]],["J'ai ___ continuer. (pouvoir)",["pu"]],["J'ai ___ mon premier combat. (faire)",["fait"]],["J'___ morte de peur. (être, imparfait)",["étais"]],["J'ai ___ ! (gagner)",["gagné"]],["Le camp ___ dans la jungle. (être, imparfait)",["était"]]],
prod:"Escribe 150 palabras sobre el mejor viaje o la mejor experiencia de tu vida."},

{id:"11.4", t:"Día 4 · Repaso: los pronombres", html:`
<table><tr><th>Tipo</th><th>Pronombres</th><th>Sustituye a</th></tr>
<tr><td>COD</td><td>me, te, le, la, nous, vous, les</td><td>algo o alguien (sin preposición)</td></tr>
<tr><td>COI</td><td>me, te, lui, nous, vous, leur</td><td>à + persona</td></tr>
<tr><td>y</td><td>y</td><td>lugar / à + cosa</td></tr>
<tr><td>en</td><td>en</td><td>de + cosa / cantidad</td></tr>
<tr><td>Tónicos</td><td>moi, toi, lui, elle, nous, vous, eux, elles</td><td>tras preposición o para insistir</td></tr></table>
<p><b>Posición:</b> delante del verbo conjugado, delante del auxiliar en pasado, delante del infinitivo con dos verbos, detrás con guion en el imperativo afirmativo.</p>
<p>Tónicos: <i>Moi, j'adore ça. Avec toi. Chez eux. C'est pour elle.</i></p>`,
ex:[["Tu vois Léa ? Oui, je ___ vois.",["la"]],["Tu parles à Léa ? Oui, je ___ parle.",["lui"]],["Tu vas à la salle ? Oui, j'___ vais.",["y"]],["Tu veux du gâteau ? Oui, j'___ veux.",["en"]],["___ , j'adore la boxe. (yo, tónico)",["moi"]],["Je viens avec ___ . (tú, tónico)",["toi"]],["On dîne chez ___ . (ellos, tónico)",["eux"]],["J'ai vu le film. → Je l'___ vu.",["ai"]],["Je vais ___ appeler. (a ella, COD)",["l'"]],["Imperativo: Regarde ___ ! (a mí)",["moi"]]],
prod:"Escribe un diálogo de 10 líneas entre dos amigas que preparan una fiesta, con todos los tipos de pronombres."},

{id:"11.5", t:"Día 5 · Repaso: futuro, condicional, imperativo y lo demás", html:`
<ul><li><b>Futur simple:</b> infinitivo + -ai, -as, -a, -ons, -ez, -ont. Raíces irregulares: ser-, aur-, ir-, fer-, viendr-, pourr-, voudr-, devr-, saur-, verr-.</li>
<li><b>Conditionnel:</b> misma raíz + -ais, -ais, -ait, -ions, -iez, -aient. <i>Si + imparfait → conditionnel.</i></li>
<li><b>Imperativo:</b> tu / nous / vous sin pronombre; -er sin -s en <i>tu</i>; <i>sois, aie, sache</i>.</li>
<li><b>Subjonctif:</b> tras <i>il faut que, je veux que, bien que, pour que</i>. Formas clave: <i>sois, aie, fasse, aille, puisse</i>.</li>
<li><b>Comparar:</b> plus / moins / aussi … que · meilleur / mieux / pire.</li>
<li><b>Relativos:</b> qui, que, où, dont.</li></ul>`,
ex:[["Je ___ demain. (venir, futur)",["viendrai"]],["Nous ___ à Paris. (aller, futur)",["irons"]],["Je ___ si je pouvais. (venir, cond.)",["viendrais"]],["Si tu ___ riche… (être, imparfait)",["étais"]],["(tu) ___ ! (écouter, imperativo)",["écoute"]],["(vous) ___ patients ! (être)",["soyez"]],["Il faut que tu ___ du sport. (faire)",["fasses"]],["Elle danse ___ que moi. (mejor)",["mieux"]],["La fille ___ j'ai rencontrée.",["que"]],["C'est l'endroit ___ on s'est vus.",["où"]]],
prod:"Escribe una carta a ti misma dentro de un año con futuro, condicional y al menos un subjonctif."},

const AV = ["ai","as","a","avons","avez","ont"], ES = ["suis","es","est","sommes","êtes","sont"];
function vPart(v){
  const [inf, , o] = v; if (o.pp) return o.pp;
  if (inf.endsWith("er")) return inf.slice(0, -2) + "é";
  if (inf.endsWith("ir")) return inf.slice(0, -2) + "i";
  return inf.slice(0, -2) + "u";
}
function vPres(v){
  const [inf, , o] = v; if (o.pres) return o.pres.split(" ");
  const st = inf.slice(0, -2);
  if (o.g === "ir") return ["is","is","it","issons","issez","issent"].map(e => st + e);
  if (o.g === "re") return ["s","s","","ons","ez","ent"].map(e => st + e);
  const nous = /g$/.test(st) ? st + "eons" : /c$/.test(st) ? st.slice(0, -1) + "çons" : st + "ons";
  return [st + "e", st + "es", st + "e", nous, st + "ez", st + "ent"];
}
const joinStem = (b, e) => /^i/.test(e) ? b.replace(/ge$/, "g").replace(/ç$/, "c") + e : b + e;
function conj(v, tense){
  const [inf, , o] = v;
  if (tense === "pres") return vPres(v);
  if (tense === "pp"){
    const p = vPart(v);
    if (o.aux !== "e") return AV.map(a => a + " " + p);
    return ES.map((a, i) => i < 3 ? a + " " + p + "|" + a + " " + p + "e" : a + " " + p + "s|" + a + " " + p + "es");
  }
  if (tense === "imp"){
    const b = inf === "être" ? "ét" : vPres(v)[3].replace(/ons$/, "");
    return ["ais","ais","ait","ions","iez","aient"].map(e => joinStem(b, e));
  }
  const fs = o.fs || (inf.endsWith("re") ? inf.slice(0, -1) : inf);
  if (tense === "fut") return ["ai","as","a","ons","ez","ont"].map(e => fs + e);
  return ["ais","ais","ait","ions","iez","aient"].map(e => fs + e);
}

/* Coco: la mascota (un cruasán con boina). Estados: idle, happy, cele, sad, sleep, think, wave.
   La función se llama moka() por compatibilidad con el resto del código. */
function moka(state, size, extra){
  state = state || "idle";
  const s = size || 96, EY = 66;
  const eyeOpen = (cx, dx, dy) => '<circle cx="' + cx + '" cy="' + EY + '" r="8.2" fill="#fff" stroke="var(--m-ink)" stroke-width="1.6"/><circle cx="' + (cx + (dx || 0.8)) + '" cy="' + (EY + 0.8 + (dy || 0)) + '" r="4.4" fill="var(--m-ink)"/><circle cx="' + (cx + (dx || 0.8) + 1.3) + '" cy="' + (EY - 0.8 + (dy || 0)) + '" r="1.3" fill="#fff"/>';
  const arc = (up, w) => '<path d="M41.5 ' + (EY + 2) + ' q6.5 ' + (up ? -8 : 5) + ' 13 0 M65.5 ' + (EY + 2) + ' q6.5 ' + (up ? -8 : 5) + ' 13 0" fill="none" stroke="var(--m-ink)" stroke-width="' + (w || 3.4) + '" stroke-linecap="round"/>';
  let eyes, mouth, xtra = "";
  const M = EY + 12;
  if (state === "happy" || state === "wave"){
    eyes = arc(true);
    mouth = '<path d="M52 ' + M + ' q8 9 16 0 z" fill="var(--m-ink)" stroke="var(--m-ink)" stroke-width="2" stroke-linejoin="round"/><path d="M56 ' + (M + 4) + ' q4 3 8 0" fill="#FF8FA3"/>';
  } else if (state === "cele"){
    eyes = arc(true, 3.6);
    mouth = '<path d="M49 ' + (M - 2) + ' q11 15 22 0 z" fill="var(--m-ink)" stroke="var(--m-ink)" stroke-width="2" stroke-linejoin="round"/><path d="M54 ' + (M + 4) + ' q6 5 12 0" fill="#FF8FA3"/>';
    xtra = '<g class="spark"><path d="M6 40 l2 -6 l2 6 l6 2 l-6 2 l-2 6 l-2 -6 l-6 -2z" fill="var(--sun)"/><path d="M108 52 l1.6 -5 l1.6 5 l5 1.6 l-5 1.6 l-1.6 5 l-1.6 -5 l-5 -1.6z" fill="var(--sun)"/><path d="M100 4 l1.3 -4 l1.3 4 l4 1.3 l-4 1.3 l-1.3 4 l-1.3 -4 l-4 -1.3z" fill="var(--sun)"/></g>';
  } else if (state === "sad"){
    eyes = eyeOpen(48, 0, 1.4) + eyeOpen(72, 0, 1.4) + '<path d="M40 ' + (EY - 10) + ' l11 -4 M80 ' + (EY - 10) + ' l-11 -4" stroke="var(--m-ink)" stroke-width="3" stroke-linecap="round"/>';
    mouth = '<path d="M53 ' + (M + 6) + ' q7 -6 14 0" fill="none" stroke="var(--m-ink)" stroke-width="3" stroke-linecap="round"/>';
    xtra = '<path class="drop" d="M88 56 q4 6 0 9 q-4 -3 0 -9z" fill="#8EC5FF"/>';
  } else if (state === "sleep"){
    eyes = arc(false, 3.2);
    mouth = '<ellipse cx="60" cy="' + (M + 3) + '" rx="3" ry="3.6" fill="var(--m-ink)"/>';
    xtra = '<g class="zz" fill="var(--ink-2)" font-family="var(--round)" font-weight="800"><text x="92" y="14" font-size="16">z</text><text x="102" y="2" font-size="12">z</text><text x="110" y="-8" font-size="9">z</text></g>';
  } else if (state === "think"){
    eyes = '<g class="blink">' + eyeOpen(48, 2.2, -2) + eyeOpen(72, 2.2, -2) + '</g>';
    mouth = '<path d="M55 ' + (M + 3) + ' h10" stroke="var(--m-ink)" stroke-width="3" stroke-linecap="round"/>';
  } else {
    eyes = '<g class="blink">' + eyeOpen(48) + eyeOpen(72) + '</g>';
    mouth = '<path d="M53.5 ' + M + ' q6.5 6 13 0" fill="none" stroke="var(--m-ink)" stroke-width="3" stroke-linecap="round"/>';
  }
  const arm = state === "wave" ? '<g class="arm"><path d="M24 74 Q10 68 9 54" fill="none" stroke="var(--m-crust-d)" stroke-width="6.5" stroke-linecap="round"/><circle cx="9" cy="50" r="6" fill="var(--m-crust-l)" stroke="var(--m-crust-d)" stroke-width="2.5"/></g>' : "";
  /* un lóbulo del cruasán: elipse girada con su brillo */
  const lobe = (cx, cy, rx, ry, r) => '<g transform="translate(' + cx + ' ' + cy + ') rotate(' + r + ')"><ellipse rx="' + rx + '" ry="' + ry + '" fill="var(--m-crust)" stroke="var(--m-crust-d)" stroke-width="2.4"/><ellipse cx="' + (-rx * 0.25) + '" cy="' + (-ry * 0.45) + '" rx="' + (rx * 0.45) + '" ry="' + (ry * 0.22) + '" fill="var(--m-crust-l)" opacity=".8"/></g>';
  return '<svg class="moka ' + state + (extra ? " " + extra : "") + '" width="' + s + '" height="' + Math.round(s * 164 / 120) + '" viewBox="0 -28 120 164" aria-hidden="true">' + xtra +
    '<g class="body">' +
      /* puntas y bandas laterales del cruasán */
      lobe(14, 100, 8, 15, -18) + lobe(106, 100, 8, 15, 18) +
      lobe(29, 84, 14, 26, -30) + lobe(91, 84, 14, 26, 30) +
      /* cuerpo central */
      '<ellipse cx="60" cy="78" rx="31" ry="38" fill="var(--m-crust)" stroke="var(--m-crust-d)" stroke-width="2.6"/>' +
      '<path d="M36 104 Q60 118 84 104" fill="none" stroke="var(--m-crust-d)" stroke-width="2.2" stroke-linecap="round" opacity=".5"/>' +
      '<ellipse cx="46" cy="50" rx="11" ry="4.5" fill="var(--m-crust-l)" opacity=".85" transform="rotate(-24 46 50)"/>' +
      /* boina */
      '<g class="beret"><path d="M30 42 Q34 20 62 20 Q92 20 92 40 Q78 34 60 35 Q42 36 30 42z" fill="var(--m-beret)" stroke="var(--m-beret-d)" stroke-width="2" stroke-linejoin="round"/>' +
      '<path d="M60 20 q1 -7 5 -8" fill="none" stroke="var(--m-beret-d)" stroke-width="3.2" stroke-linecap="round"/></g>' +
      '<ellipse cx="34" cy="' + (EY + 10) + '" rx="5.2" ry="3.2" fill="#FF8FA3" opacity=".65"/><ellipse cx="86" cy="' + (EY + 10) + '" rx="5.2" ry="3.2" fill="#FF8FA3" opacity=".65"/>' +
      eyes + mouth + arm +
      '<ellipse cx="60" cy="120" rx="48" ry="3.4" fill="var(--m-ink)" opacity=".12"/>' +
    '</g></svg>';
}

let SES = null;
function distract(id, n){
  const cat = catOf(D[id - 1][1]), g0 = strip(gloss(id)), seenG = new Set([g0]), seenW = new Set([D[id - 1][0].toLowerCase()]), out = [];
  const tryAdd = j => { const g = strip(gloss(j)), w = D[j - 1][0].toLowerCase(); if (seenG.has(g) || seenW.has(w)) return; seenG.add(g); seenW.add(w); out.push(j); };

  for (let k = 0; k < 400 && out.length < n; k++) tryAdd(1 + rnd(D.length));

}
const recallType = id => clozeOf(id) ? "cloze" : "type";

  if (ivl < 3) return x < 0.5 ? "mcci" : "mcic";

const NUMW = "zéro un deux trois quatre cinq six sept huit neuf dix onze douze treize quatorze quinze seize dix-sept dix-huit dix-neuf vingt".split(" ");

  alts.forEach(a => {
    const bag = normW(a), used = new Array(bag.length).fill(false);
    const words = tw.map(w => { const n = normW(w).join(" "); if (!n) return [w, true]; const k = bag.findIndex((b, i) => !used[i] && (b === n || n.split(" ").includes(b))); if (k >= 0) { used[k] = true; return [w, true]; } return [w, false]; });
    const pct = Math.round(words.filter(w => w[1]).length / Math.max(1, words.length) * 100);

  });
  return best;
}

  const l = LESSONS.find(x => x.id === id); if (!l) return;
  const xp0 = S.xp || 0, before = lessonScore(l);
  _checkLesson(id);
  const e = S.ex[l.id]; if (!e || !e.a.every(v => String(v || "").trim() !== "")) return;
  const s = lessonScore(l);
  if (!before || s.ok !== before.ok || (S.xp || 0) > xp0 || !CELQ.length) celQ({kind:"lesson", ok:s.ok, total:s.total, xp:(S.xp || 0) - xp0, t:l.t.replace(/^Día \d+ · /, "")});
};

/* +XP que surt volant en cada encert */
const _setFb = setFb;
setFb = function(ok, title, detail){
  _setFb(ok, title, detail);
  const it = SES && SES.cur; if (!ok || !it || it.t === "intro" || it.t === "dintro" || calm()) return;
  const btn = document.querySelector(".s-foot [data-a=next]"); if (!btn) return;
  const r = btn.getBoundingClientRect(), f = document.createElement("div");
  f.className = "xpfly num"; f.textContent = "+" + (it.t === "match" ? 5 : 2) + " XP" + (SES.combo >= 3 ? "  ·  " + SES.combo + "🔥" : "");
  f.style.left = (r.left + r.width / 2) + "px"; f.style.top = (r.top - 8) + "px";
  document.body.appendChild(f); setTimeout(() => f.remove(), 1100);
  const tr = document.querySelector(".track i"); if (tr) { tr.classList.remove("glow"); void tr.offsetWidth; tr.classList.add("glow"); }
};

/* entrada a l'app */
function splash(){
  if (!S.onboard || calm()) return;
  const hr = now().getHours(), hi = hr < 6 ? "Bonne nuit" : hr < 18 ? "Bonjour" : "Bonsoir";
  const el = document.createElement("div"); el.id = "splash"; el.className = "splash";
  el.innerHTML = '<div class="sp-in"><div class="sp-mk">' + moka("wave", 120) + '</div><div class="sp-t">Français</div><div class="sp-s">' + esc(hi + (S.name ? ", " + S.name : "") + " !") + '</div><div class="sp-flag"><i></i><i></i><i></i></div></div>';
  document.body.appendChild(el);
  const end = () => { if (!el.isConnected) return; el.classList.add("out"); setTimeout(() => { el.remove(); celNext(); }, 450); };
  el.addEventListener("click", end); setTimeout(end, 1500);
}

applyFreeze();
splash();
render();

</script>
