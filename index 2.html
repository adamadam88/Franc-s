{id:"2.1", t:"Día 1 · Los verbos en -ir y en -re", html:`
<p>Además de los verbos en -er hay dos grupos regulares más:</p>
<table><tr><th></th><th>finir (terminar)</th><th>vendre (vender)</th></tr>
<tr><td>je</td><td>fin<b>is</b></td><td>vend<b>s</b></td></tr><tr><td>tu</td><td>fin<b>is</b></td><td>vend<b>s</b></td></tr>
<tr><td>il / elle</td><td>fin<b>it</b></td><td>vend</td></tr><tr><td>nous</td><td>fin<b>issons</b></td><td>vend<b>ons</b></td></tr>
<tr><td>vous</td><td>fin<b>issez</b></td><td>vend<b>ez</b></td></tr><tr><td>ils / elles</td><td>fin<b>issent</b></td><td>vend<b>ent</b></td></tr></table>
<p>Como <b>finir</b>: <i>choisir</i> (elegir), <i>réussir</i> (aprobar, lograr), <i>grandir</i> (crecer). Como <b>vendre</b>: <i>attendre</i> (esperar), <i>répondre</i>, <i>entendre</i> (oír), <i>perdre</i>, <i>descendre</i>.</p>
<p><b>Cuidado con los falsos amigos:</b> <i>attendre</i> es <b>esperar</b> (no «atender») y <i>entendre</i> es <b>oír</b> (entender es <i>comprendre</i>).</p>`,
ex:[["Je ___ à six heures. (finir)",["finis"]],["Tu ___ quel film ? (choisir)",["choisis"]],["Elle ___ ses examens. (réussir)",["réussit"]],["Nous ___ le bus. (attendre)",["attendons"]],["Vous ___ au téléphone ? (répondre)",["répondez"]],["Ils ___ leur maison. (vendre)",["vendent"]],["J'___ un bruit. (entendre)",["entends"]],["Il ___ toujours ses clés. (perdre)",["perd"]],["Nous ___ tard. (finir)",["finissons"]],["Elles ___ un cadeau. (choisir)",["choisissent"]]],
prod:"Escribe 5 frases sobre tu rutina con verbos de los tres grupos: je travaille, je finis, j'attends…"},

{id:"2.2", t:"Día 2 · Aller, venir y faire", html:`
<p>Tres irregulares que usarás cada día:</p>
<table><tr><th></th><th>aller (ir)</th><th>venir (venir)</th><th>faire (hacer)</th></tr>
<tr><td>je</td><td>vais</td><td>viens</td><td>fais</td></tr><tr><td>tu</td><td>vas</td><td>viens</td><td>fais</td></tr>
<tr><td>il / elle</td><td>va</td><td>vient</td><td>fait</td></tr><tr><td>nous</td><td>allons</td><td>venons</td><td>faisons</td></tr>
<tr><td>vous</td><td>allez</td><td>venez</td><td><b>faites</b></td></tr><tr><td>ils / elles</td><td>vont</td><td>viennent</td><td>font</td></tr></table>
<p><b>aller à</b> + ciudad, <b>aller en</b> + país femenino (<i>en France, en Thaïlande</i>), <b>aller au</b> + país masculino (<i>au Canada</i>). <b>venir de</b>: <i>Je viens de Séville</i>.</p>
<p><b>faire</b> sirve para muchísimo: <i>faire du sport, faire de la boxe, faire les courses</i> (hacer la compra), <i>faire la cuisine</i> (cocinar). Y el tiempo: <i>Il fait beau, il fait froid</i>.</p>`,
ex:[["Je ___ au cinéma. (aller)",["vais"]],["Tu ___ avec nous ? (venir)",["viens"]],["Elle ___ de la boxe. (faire)",["fait"]],["Nous ___ en France. (aller)",["allons"]],["Vous ___ quoi ce soir ? (faire)",["faites"]],["Ils ___ de Barcelone. (venir)",["viennent"]],["On ___ les courses. (faire)",["fait"]],["Ils ___ à la plage. (aller)",["vont"]],["Je vais ___ Thaïlande. (en / au)",["en"]],["Il ___ beau aujourd'hui. (faire)",["fait"]]],
prod:"Cuenta adónde vas esta semana y qué haces cada día: Lundi, je vais à la salle et je fais…"},

{id:"2.3", t:"Día 3 · Prendre, mettre, boire y dire", html:`
<table><tr><th></th><th>prendre</th><th>mettre</th><th>boire</th><th>dire</th></tr>
<tr><td>je</td><td>prends</td><td>mets</td><td>bois</td><td>dis</td></tr><tr><td>tu</td><td>prends</td><td>mets</td><td>bois</td><td>dis</td></tr>
<tr><td>il / elle</td><td>prend</td><td>met</td><td>boit</td><td>dit</td></tr><tr><td>nous</td><td>prenons</td><td>mettons</td><td>buvons</td><td>disons</td></tr>
<tr><td>vous</td><td>prenez</td><td>mettez</td><td>buvez</td><td><b>dites</b></td></tr><tr><td>ils / elles</td><td><b>prennent</b></td><td>mettent</td><td>boivent</td><td>disent</td></tr></table>
<p><b>prendre</b> = coger, tomar: <i>prendre le métro, prendre un café, prendre une douche</i>. Igual se conjugan <i>comprendre</i> y <i>apprendre</i>.</p>
<p><b>mettre</b> = poner y también <b>ponerse</b> (ropa): <i>Je mets mon manteau</i>. Muy útil en el mundo de la moda.</p>`,
ex:[["Je ___ le métro. (prendre)",["prends"]],["Ils ___ un taxi. (prendre)",["prennent"]],["Tu ___ ta veste ? (mettre)",["mets"]],["Nous ___ de l'eau. (boire)",["buvons"]],["Elle ___ un café. (boire)",["boit"]],["Vous ___ quoi ? (dire)",["dites"]],["Je ne ___ pas. (comprendre)",["comprends"]],["Nous ___ le français. (apprendre)",["apprenons"]],["Ils ___ la vérité. (dire)",["disent"]],["Elles ___ une robe noire. (mettre)",["mettent"]]],
prod:"Describe tu mañana: qué te pones, qué bebes, qué transporte coges."},

{id:"2.4", t:"Día 4 · Los posesivos", html:`
<p>Como en español, el posesivo concuerda con <b>la cosa</b>, no con la persona:</p>
<table><tr><th></th><th>masc.</th><th>fem.</th><th>plural</th></tr>
<tr><td>yo</td><td>mon</td><td>ma</td><td>mes</td></tr><tr><td>tú</td><td>ton</td><td>ta</td><td>tes</td></tr>
<tr><td>él / ella</td><td>son</td><td>sa</td><td>ses</td></tr><tr><td>nosotros</td><td>notre</td><td>notre</td><td>nos</td></tr>
<tr><td>vosotros / usted</td><td>votre</td><td>votre</td><td>vos</td></tr><tr><td>ellos</td><td>leur</td><td>leur</td><td>leurs</td></tr></table>
<p><b>Ojo:</b> <i>son / sa</i> sirven para «de él» y «de ella»: <i>Martina et sa sœur, Hugo et sa sœur</i>. Delante de una palabra femenina que empieza por vocal se usa <b>mon, ton, son</b>: <i>mon amie, ton école</i>.</p>`,
ex:[["___ frère (mi)",["mon"]],["___ mère (mi)",["ma"]],["___ parents (mi)",["mes"]],["___ sœur (tu, informal)",["ta"]],["Elle aime ___ chat. (su)",["son"]],["Il appelle ___ copine. (su)",["sa"]],["___ amie (mi, fem. con vocal)",["mon"]],["___ maison (nuestra)",["notre"]],["___ enfants (sus, de ellos)",["leurs"]],["___ livres (vuestros / sus de usted)",["vos"]]],
prod:"Presenta a tu familia con posesivos: Mon père s'appelle…, ma mère est…"},

{id:"2.5", t:"Día 5 · Gustos: aimer, adorer, préférer, détester", html:`
<p>Los verbos de gusto van seguidos del <b>artículo determinado</b>, aunque en español no lo pongamos igual: <i>J'aime <b>le</b> cinéma. Je déteste <b>les</b> araignées.</i></p>
<p>Escala: <i>j'adore</i> (me encanta) › <i>j'aime beaucoup</i> › <i>j'aime bien</i> (me gusta) › <i>je n'aime pas trop</i> › <i>je n'aime pas</i> › <i>je déteste</i> (odio).</p>
<p>Con un verbo detrás, en infinitivo: <i>J'aime voyager. Je préfère regarder des séries.</i></p>
<p><b>préférer</b> cambia el acento: <i>je préf<b>è</b>re, tu préfères, il préfère, nous préférons, vous préférez, ils préfèrent</i>. Ojo con «gustar»: en francés la persona es el sujeto. <i>J'aime</i> = (a mí) me gusta.</p>`,
ex:[["J'aime ___ cinéma. (artículo)",["le"]],["Je déteste ___ araignées. (artículo)",["les"]],["Tu ___ le thé ou le café ? (préférer)",["préfères"]],["Nous ___ le chocolat. (adorer)",["adorons"]],["Ils ___ voyager. (aimer)",["aiment"]],["Elle ___ la pluie. (détester)",["déteste"]],["J'aime ___ musique française. (artículo)",["la"]],["Vous ___ quelle série ? (préférer)",["préférez"]],["Je n'aime pas ___ . (madrugar = se lever tôt)",["me lever tôt"]],["J'aime ___ boxe thaï. (artículo)",["la"]]],
prod:"Escribe 6 frases sobre tus gustos usando toda la escala, de j'adore a je déteste."},

{id:"2.6", t:"Día 6 · Números, horas y sesión larga", html:`
<p>De 0 a 69 son fáciles. Luego viene lo raro:</p>
<table><tr><th>Número</th><th>Francés</th><th>Literalmente</th></tr>
<tr><td>70</td><td>soixante-dix</td><td>sesenta-diez</td></tr><tr><td>75</td><td>soixante-quinze</td><td>sesenta-quince</td></tr>
<tr><td>80</td><td>quatre-vingts</td><td>cuatro-veintes</td></tr><tr><td>90</td><td>quatre-vingt-dix</td><td>cuatro-veinte-diez</td></tr>
<tr><td>99</td><td>quatre-vingt-dix-neuf</td><td>cuatro-veinte-diez-nueve</td></tr></table>
<p>(En Bélgica y Suiza dicen <i>septante, nonante</i>: mucho más fácil.)</p>
<p><b>La hora:</b> <i>Quelle heure est-il ? Il est huit heures.</i> · <i>huit heures et quart</i> (y cuarto) · <i>huit heures et demie</i> (y media) · <i>neuf heures moins le quart</i> (menos cuarto). En horarios oficiales se usa el reloj de 24 h: <i>à vingt heures</i> = a las ocho de la tarde.</p>
<p><b>Sesión larga:</b> mira un vídeo de <i>Easy French</i> en YouTube con subtítulos y apunta tres números que oigas.</p>`,
ex:[["70 en francés",["soixante-dix"]],["80 en francés",["quatre-vingts"]],["90 en francés",["quatre-vingt-dix"]],["75 en francés",["soixante-quinze"]],["21 en francés",["vingt et un"]],["Quelle ___ est-il ? (hora)",["heure"]],["8:30 → huit heures et ___",["demie"]],["8:15 → huit heures et ___",["quart"]],["Il est ___ heures. (3:00)",["trois"]],["Le film commence à ___ heures. (20:00)",["vingt"]]],
prod:"Escribe tu horario de un día: a qué hora te levantas, trabajas o estudias, entrenas y te acuestas."},

{id:"2.7", t:"Día 7 · Prueba de la semana 2", html:`<p>Responde sin mirar. Si fallas más de 3, repasa los verbos irregulares.</p>`,
ex:[["Nous ___ à huit heures. (finir)",["finissons"]],["J'___ le bus. (attendre)",["attends"]],["Tu ___ où ? (aller)",["vas"]],["Ils ___ de Madrid. (venir)",["viennent"]],["Vous ___ du sport ? (faire)",["faites"]],["Elles ___ le train. (prendre)",["prennent"]],["Nous ___ du café. (boire)",["buvons"]],["Vous ___ la vérité ? (dire)",["dites"]],["___ amie (mi)",["mon"]],["___ parents (sus, de ella)",["ses"]],["J'aime ___ séries. (artículo)",["les"]],["Je ___ le thé. (préférer)",["préfère"]],["80 en francés",["quatre-vingts"]],["8:30 → huit heures et ___",["demie"]],["Je vais ___ Canada. (au / en)",["au"]],["Je ___ un bruit. (entendre)",["entends"]]],
prod:"Describe a tu familia y tus gustos en 6 frases, con posesivos y verbos de gusto."},

{id:"3.1", t:"Día 1 · Pouvoir, vouloir y devoir", html:`
<p>Los tres verbos «modales» van seguidos de un <b>infinitivo</b>:</p>
<table><tr><th></th><th>pouvoir (poder)</th><th>vouloir (querer)</th><th>devoir (deber)</th></tr>
<tr><td>je</td><td>peux</td><td>veux</td><td>dois</td></tr><tr><td>tu</td><td>peux</td><td>veux</td><td>dois</td></tr>
<tr><td>il / elle</td><td>peut</td><td>veut</td><td>doit</td></tr><tr><td>nous</td><td>pouvons</td><td>voulons</td><td>devons</td></tr>
<tr><td>vous</td><td>pouvez</td><td>voulez</td><td>devez</td></tr><tr><td>ils / elles</td><td>peuvent</td><td>veulent</td><td>doivent</td></tr></table>
<p><i>Je peux venir ? Je veux apprendre le français. Je dois travailler.</i> Negación alrededor del primer verbo: <i>Je ne peux pas venir</i>.</p>
<p>Para pedir algo con educación no uses <i>je veux</i>, sino <b>je voudrais</b> (quisiera): <i>Je voudrais un café, s'il vous plaît.</i></p>`,
ex:[["Je ___ t'aider. (pouvoir)",["peux"]],["Tu ___ venir ? (vouloir)",["veux"]],["Elle ___ partir. (devoir)",["doit"]],["Nous ___ réserver. (devoir)",["devons"]],["Vous ___ répéter ? (pouvoir)",["pouvez"]],["Ils ___ sortir. (vouloir)",["veulent"]],["Elles ___ attendre. (pouvoir)",["peuvent"]],["Ils ___ s'entraîner. (devoir)",["doivent"]],["Negativa: Je peux venir. → Je ___ venir.",["ne peux pas"]],["Forma educada: Je ___ un thé, s'il vous plaît.",["voudrais"]]],
prod:"Escribe 3 cosas que quieres hacer este año, 3 que puedes hacer bien y 3 que debes hacer esta semana."},

{id:"3.2", t:"Día 2 · Los verbos reflexivos", html:`
<p>Como en español, llevan un pronombre: <i>se lever</i> (levantarse).</p>
<table><tr><th></th><th>se lever</th></tr>
<tr><td>je</td><td><b>me</b> lève</td></tr><tr><td>tu</td><td><b>te</b> lèves</td></tr><tr><td>il / elle</td><td><b>se</b> lève</td></tr>
<tr><td>nous</td><td><b>nous</b> levons</td></tr><tr><td>vous</td><td><b>vous</b> levez</td></tr><tr><td>ils / elles</td><td><b>se</b> lèvent</td></tr></table>
<p>Delante de vocal: <i>je m'habille, tu t'appelles, il s'entraîne</i>. Negación: <i>Je <b>ne</b> me lève <b>pas</b> tôt.</i></p>
<p>Los más útiles: <i>se réveiller, se lever, se doucher, s'habiller, se maquiller, se dépêcher, se coucher, se reposer, s'entraîner</i>. Ojo: <i>se rappeler</i> (acordarse) y <i>s'ennuyer</i> (aburrirse).</p>`,
ex:[["Je ___ à sept heures. (se lever)",["me lève"]],["Tu ___ comment ? (s'appeler)",["t'appelles"]],["Elle ___ le soir. (s'entraîner)",["s'entraîne"]],["Nous ___ vite. (se dépêcher)",["nous dépêchons"]],["Vous ___ tard ? (se coucher)",["vous couchez"]],["Ils ___ le dimanche. (se reposer)",["se reposent"]],["Je ___ en noir. (s'habiller)",["m'habille"]],["Je ___ à six heures. (se réveiller)",["me réveille"]],["Negativa: Je me lève tôt. → Je ___ tôt.",["ne me lève pas"]],["Elle ___ après le sport. (se doucher)",["se douche"]]],
prod:"Cuenta tu rutina de la mañana con al menos 6 verbos reflexivos."},

{id:"3.3", t:"Día 3 · Au, du y el partitivo", html:`
<p><b>Contracciones:</b> <i>à + le = <b>au</b></i>, <i>à + les = <b>aux</b></i>, <i>de + le = <b>du</b></i>, <i>de + les = <b>des</b></i>. Con <i>la</i> y <i>l'</i> no cambia nada: <i>à la plage, de l'hôtel</i>. <i>Je vais au cinéma. Je viens du travail.</i></p>
<p><b>El partitivo</b> sirve para cantidades que no se cuentan (algo de): <b>du</b> pain, <b>de la</b> viande, <b>de l'</b>eau, <b>des</b> frites. En español no se dice nada: <i>Je mange du pain</i> = Como pan.</p>
<p>Tras negación o con cantidad, todo pasa a <b>de</b>: <i>Je ne mange pas <b>de</b> viande. Beaucoup <b>de</b> gens. Un kilo <b>de</b> tomates.</i> Pero tras gustos, artículo determinado: <i>J'aime <b>le</b> fromage.</i></p>`,
ex:[["Je vais ___ cinéma. (à + le)",["au"]],["Je parle ___ voisins. (à + les)",["aux"]],["Je viens ___ travail. (de + le)",["du"]],["Je bois ___ eau.",["de l'"]],["Je mange ___ pain.",["du"]],["Tu veux ___ salade ?",["de la"]],["Je ne mange pas ___ viande.",["de"]],["Il y a beaucoup ___ touristes.",["de"]],["J'aime ___ fromage. (gusto)",["le"]],["On va ___ plage. (à + la)",["à la"]]],
prod:"Describe lo que comes en un día normal usando du, de la, des y pas de."},

{id:"3.4", t:"Día 4 · Ce, cette, ces y c'est / il est", html:`
<p>Los demostrativos: <b>ce</b> (masc.), <b>cet</b> (masc. delante de vocal o h), <b>cette</b> (fem.), <b>ces</b> (plural). <i>Ce film, cet hôtel, cette robe, ces chaussures.</i> Sirven para «este» y «ese». Para distinguir: <i>ce film-ci</i> (este) / <i>ce film-là</i> (ese).</p>
<p><b>C'est o il / elle est?</b> Las dos traducen «es».</p>
<ul><li><b>C'est</b> + artículo o nombre propio: <i>C'est une actrice. C'est Martina.</i> También para opinar: <i>C'est génial !</i></li>
<li><b>Il / elle est</b> + adjetivo o profesión sin artículo: <i>Elle est actrice. Il est sympa.</i></li></ul>`,
ex:[["___ film (este)",["ce"]],["___ hôtel (este, con vocal)",["cet"]],["___ robe (este)",["cette"]],["___ chaussures (estos)",["ces"]],["___ ami (este, con vocal)",["cet"]],["___ une actrice. (c'est / elle est)",["c'est"]],["___ actrice. (c'est / elle est)",["elle est"]],["___ super ! (opinión)",["c'est"]],["___ très sympa. (il est / c'est, de una persona)",["il est"]],["___ Martina. (presentación)",["c'est"]]],
prod:"Describe 5 prendas que llevas hoy con demostrativos: Ce pull est…, ces baskets sont…"},

{id:"3.5", t:"Día 5 · El adjetivo: concordancia y posición", html:`
<p>Casi todos los adjetivos van <b>detrás</b> del nombre, como en español: <i>une robe noire, un film français</i>.</p>
<p>Pero un grupo corto va <b>delante</b>. Recuérdalos con <b>BAGS</b>: <b>B</b>eauty (beau, joli), <b>A</b>ge (jeune, vieux, nouveau), <b>G</b>ood/bad (bon, mauvais), <b>S</b>ize (grand, petit, gros). <i>Un petit appartement, une belle ville, un bon restaurant.</i></p>
<p><b>Tres adjetivos especiales</b> tienen otra forma delante de vocal: <i>beau → <b>bel</b></i> (un bel homme), <i>nouveau → <b>nouvel</b></i> (un nouvel ami), <i>vieux → <b>vieil</b></i> (un vieil hôtel). Femeninos: <i>belle, nouvelle, vieille</i>.</p>`,
ex:[["une robe ___ (noir, fem.)",["noire"]],["un ___ appartement (petit)",["petit"]],["une ___ ville (beau, fem.)",["belle"]],["un ___ homme (beau, delante de vocal)",["bel"]],["un ___ ami (nouveau, delante de vocal)",["nouvel"]],["une ___ maison (vieux, fem.)",["vieille"]],["des chaussures ___ (blanc, fem. pl.)",["blanches"]],["un ___ restaurant (bon)",["bon"]],["une ___ idée (bon, fem.)",["bonne"]],["un ___ hôtel (vieux, delante de vocal)",["vieil"]]],
prod:"Describe tu barrio o tu ciudad con 8 adjetivos, algunos delante y otros detrás."},

{id:"3.6", t:"Día 6 · En el café y sesión larga", html:`
<p><b>Frases para pedir en un café o restaurante:</b></p>
<ul><li><i>Bonjour, une table pour deux, s'il vous plaît.</i></li>
<li><i>Je voudrais un café crème et un croissant.</i></li>
<li><i>Qu'est-ce que vous me conseillez ?</i> (¿Qué me recomienda?)</li>
<li><i>Pour moi, le plat du jour.</i></li>
<li><i>Je suis végétarienne / Je ne mange pas de viande.</i></li>
<li><i>L'addition, s'il vous plaît.</i> (¡<i>addition</i> = la cuenta!)</li>
<li><i>Je peux payer par carte ?</i></li></ul>
<p>Saluda siempre con <i>Bonjour</i> al entrar: en Francia es casi una obligación. El camarero dirá <i>Bon appétit !</i> y al irte, <i>Bonne journée !</i></p>
<p><b>Sesión larga:</b> mira un vídeo de YouTube de alguien pidiendo en un café parisino (busca «commander au café Easy French») y repite las frases en voz alta.</p>`,
ex:[["Une table ___ deux. (para)",["pour"]],["Je ___ un café, s'il vous plaît. (quisiera)",["voudrais"]],["La cuenta en francés: l'___",["addition"]],["Je peux payer ___ carte ?",["par"]],["Je ne mange pas ___ viande.",["de"]],["Qu'est-ce que vous me ___ ? (recomendar)",["conseillez"]],["Bon ___ ! (que aproveche)",["appétit"]],["Le plat ___ jour (del)",["du"]],["Un croissant et un jus ___ orange",["d'"]],["Au revoir, bonne ___ !",["journée"]]],
prod:"Escribe un diálogo de 8 líneas entre tú y un camarero en un café de París."},

{id:"3.7", t:"Día 7 · Prueba de la semana 3", html:`<p>Repaso de la semana 3. Responde sin mirar.</p>`,
ex:[["Je ___ t'aider. (pouvoir)",["peux"]],["Ils ___ partir. (vouloir)",["veulent"]],["Nous ___ travailler. (devoir)",["devons"]],["Je ___ à sept heures. (se lever)",["me lève"]],["Elle ___ le soir. (s'entraîner)",["s'entraîne"]],["Je vais ___ cinéma.",["au"]],["Je bois ___ eau.",["de l'"]],["Je ne bois pas ___ café.",["de"]],["___ hôtel (este)",["cet"]],["___ chaussures (estos)",["ces"]],["___ une boxeuse. (c'est / elle est)",["c'est"]],["une ___ ville (beau, fem.)",["belle"]],["un ___ ami (nouveau, con vocal)",["nouvel"]],["une robe ___ (blanc)",["blanche"]],["Je ___ un thé, s'il vous plaît. (quisiera)",["voudrais"]],["Il y a beaucoup ___ gens.",["de"]]],
prod:"Cuenta un día normal tuyo, de la mañana a la noche, en 10 frases."},

{id:"4.1", t:"Día 1 · El passé composé con avoir", html:`
<p>El <b>passé composé</b> es el pasado más usado al hablar. Traduce a la vez «he comido» y «comí»: <i>Hier, j'ai mangé une pizza</i> = Ayer comí una pizza.</p>
<p>Se forma con <b>avoir</b> en presente + <b>participio</b>:</p>
<table><tr><th>Grupo</th><th>Participio</th><th>Ejemplo</th></tr>
<tr><td>-er</td><td>-é</td><td>parler → j'ai parl<b>é</b></td></tr>
<tr><td>-ir (finir)</td><td>-i</td><td>finir → j'ai fin<b>i</b></td></tr>
<tr><td>-re (vendre)</td><td>-u</td><td>vendre → j'ai vend<b>u</b></td></tr></table>
<p><i>j'ai regardé, tu as regardé, il a regardé, nous avons regardé, vous avez regardé, ils ont regardé</i>. Negación alrededor de <i>avoir</i>: <i>Je <b>n'</b>ai <b>pas</b> mangé.</i></p>`,
ex:[["Hier, j'___ une série. (regarder)",["ai regardé"]],["Tu ___ ton travail ? (finir)",["as fini"]],["Elle ___ sa voiture. (vendre)",["a vendu"]],["Nous ___ au restaurant. (manger)",["avons mangé"]],["Vous ___ le bus ? (attendre)",["avez attendu"]],["Ils ___ toute la nuit. (danser)",["ont dansé"]],["J'___ un cadeau. (choisir)",["ai choisi"]],["Elle ___ au tennis. (jouer)",["a joué"]],["Negativa: J'ai mangé. → Je ___ mangé.",["n'ai pas"]],["Participio de «répondre»",["répondu"]]],
prod:"Escribe 6 cosas que hiciste ayer con verbos regulares: J'ai travaillé, j'ai mangé…"},

{id:"4.2", t:"Día 2 · Los participios irregulares", html:`
<p>Los verbos irregulares tienen participios propios. Estos son los imprescindibles:</p>
<table><tr><th>Infinitivo</th><th>Participio</th><th>Ejemplo</th></tr>
<tr><td>être</td><td>été</td><td>j'ai été malade</td></tr><tr><td>avoir</td><td>eu</td><td>j'ai eu un accident</td></tr>
<tr><td>faire</td><td>fait</td><td>j'ai fait du sport</td></tr><tr><td>prendre</td><td>pris</td><td>j'ai pris le train</td></tr>
<tr><td>mettre</td><td>mis</td><td>j'ai mis une robe</td></tr><tr><td>dire</td><td>dit</td><td>il a dit oui</td></tr>
<tr><td>écrire</td><td>écrit</td><td>j'ai écrit un mail</td></tr><tr><td>voir</td><td>vu</td><td>j'ai vu un film</td></tr>
<tr><td>lire</td><td>lu</td><td>j'ai lu un livre</td></tr><tr><td>boire</td><td>bu</td><td>j'ai bu un café</td></tr>
<tr><td>pouvoir / vouloir / devoir</td><td>pu / voulu / dû</td><td>je n'ai pas pu</td></tr>
<tr><td>ouvrir</td><td>ouvert</td><td>j'ai ouvert la porte</td></tr></table>`,
ex:[["J'ai ___ du sport. (faire)",["fait"]],["Tu as ___ le film ? (voir)",["vu"]],["Elle a ___ le métro. (prendre)",["pris"]],["Nous avons ___ un mail. (écrire)",["écrit"]],["Il a ___ oui. (dire)",["dit"]],["J'ai ___ ma veste. (mettre)",["mis"]],["Ils ont ___ trop de café. (boire)",["bu"]],["J'ai ___ un accident. (avoir)",["eu"]],["Vous avez ___ ce livre ? (lire)",["lu"]],["Je n'ai pas ___ venir. (pouvoir)",["pu"]],["Elle a ___ malade. (être)",["été"]],["Il a ___ la fenêtre. (ouvrir)",["ouvert"]]],
prod:"Cuenta qué hiciste el fin de semana pasado con al menos 6 participios irregulares."},

{id:"4.3", t:"Día 3 · El passé composé con être", html:`
<p>Unos 15 verbos (casi todos de movimiento) y <b>todos los reflexivos</b> forman el pasado con <b>être</b>:</p>
<p><i>aller, venir, arriver, partir, entrer, sortir, monter, descendre, naître, mourir, rester, tomber, retourner, rentrer, revenir, devenir</i>.</p>
<p>Truco: imagina una <b>casa</b>: se entra, se sale, se sube, se baja, se cae, se nace y se muere en ella.</p>
<p><b>Con être, el participio concuerda con el sujeto</b> como un adjetivo: <i>il est allé, elle est allé<b>e</b>, ils sont allé<b>s</b>, elles sont allé<b>es</b></i>. Martina dirá: <i>Je suis allé<b>e</b> à Paris.</i> Reflexivos: <i>Je me suis levée à sept heures.</i></p>`,
ex:[["Je ___ à Paris. (aller, Martina habla)",["suis allée"]],["Il ___ hier. (arriver)",["est arrivé"]],["Elle ___ à six heures. (partir)",["est partie"]],["Nous ___ à la maison. (rester, masc.)",["sommes restés"]],["Ils ___ du bus. (descendre)",["sont descendus"]],["Elles ___ tard. (rentrer)",["sont rentrées"]],["Tu ___ quand ? (naître, chica)",["es née"]],["Il ___ dans l'escalier. (tomber)",["est tombé"]],["Je ___ à sept heures. (se lever, Martina)",["me suis levée"]],["Elle ___ avec son frère. (venir)",["est venue"]]],
prod:"Cuenta un viaje que hiciste: adónde fuiste, cuándo llegaste, dónde te quedaste y cuándo volviste."},

{id:"4.4", t:"Día 4 · ¿Être o avoir?", html:`
<p>Resumen rápido:</p>
<ul><li><b>avoir</b> con casi todos los verbos: <i>j'ai mangé, j'ai vu, j'ai fait</i>.</li>
<li><b>être</b> con los verbos de la «casa» y con todos los reflexivos: <i>je suis partie, je me suis habillée</i>.</li></ul>
<p>Con <b>avoir</b> el participio <b>no</b> concuerda con el sujeto: <i>elle a mangé</i> (sin -e). Con <b>être</b> sí: <i>elle est partie</i>.</p>
<p><b>Truco extra:</b> algunos verbos de la casa usan <i>avoir</i> cuando llevan complemento directo: <i>Je suis montée</i> (subí) pero <i>J'ai monté la valise</i> (subí la maleta). Por ahora, quédate con la regla básica.</p>`,
ex:[["J'___ mangé. (auxiliar)",["ai"]],["Je ___ partie. (auxiliar)",["suis"]],["Elle ___ vu le film. (auxiliar)",["a"]],["Elle ___ venue. (auxiliar)",["est"]],["Nous ___ fait du sport. (auxiliar)",["avons"]],["Ils ___ restés à l'hôtel. (auxiliar)",["sont"]],["Elle s'___ entraînée. (auxiliar)",["est"]],["Elle a ___ une pizza. (manger)",["mangé"]],["Elles sont ___ . (sortir)",["sorties"]],["Tu ___ pris le train ? (auxiliar)",["as"]]],
prod:"Escribe 8 frases sobre tu última semana, la mitad con avoir y la mitad con être."},

{id:"4.5", t:"Día 5 · Cuándo pasó: hier, il y a, déjà, jamais y el futuro próximo", html:`
<p><b>Marcadores de pasado:</b> <i>hier</i> (ayer), <i>avant-hier</i> (anteayer), <i>hier soir</i> (anoche), <i>la semaine dernière</i>, <i>l'année dernière</i>, <i>il y a deux jours</i> (hace dos días).</p>
<p><b>déjà / jamais:</b> <i>J'ai déjà vu ce film</i> (ya). <i>Je n'ai jamais vu ce film</i> (nunca). <i>Tu es déjà allée à Paris ?</i> (¿Has estado alguna vez…?)</p>
<p><b>El futuro próximo</b> se forma como en español: <b>aller + infinitivo</b>. <i>Je vais partir. On va regarder un film. Il va pleuvoir.</i></p>
<p><b>Pasado reciente:</b> <b>venir de + infinitivo</b> = acabar de: <i>Je viens de finir l'entraînement.</i></p>`,
ex:[["___ soir, j'ai vu un film. (anoche)",["hier"]],["Je suis arrivée ___ deux jours. (hace)",["il y a"]],["J'ai ___ vu ce film. (ya)",["déjà"]],["Je n'ai ___ mangé de crêpes. (nunca)",["jamais"]],["La semaine ___ (pasada)",["dernière"]],["Demain, je ___ partir. (voy a)",["vais"]],["On ___ regarder un film. (vamos a)",["va"]],["Il ___ pleuvoir. (va a)",["va"]],["Je ___ finir l'entraînement. (acabo de)",["viens de"]],["Ils ___ arriver. (acaban de)",["viennent d'","viennent de"]]],
prod:"Escribe 3 cosas que hiciste la semana pasada, 2 que no has hecho nunca y 3 que vas a hacer el próximo fin de semana."},

{id:"4.6", t:"Día 6 · Contar un viaje y sesión larga", html:`
<p>Estructura para contar un viaje en pasado:</p>
<ol><li><b>Cuándo y adónde:</b> <i>L'été dernier, je suis allée en Thaïlande avec deux amies.</i></li>
<li><b>Cómo:</b> <i>On a pris l'avion à Madrid et on est arrivées à Bangkok le matin.</i></li>
<li><b>Qué hiciste:</b> <i>On a visité des temples, on a mangé dans la rue et j'ai pris un cours de boxe thaï.</i></li>
<li><b>Una anécdota:</b> <i>Un jour, j'ai perdu mon passeport !</i></li>
<li><b>Valoración:</b> <i>C'était génial. Je veux y retourner.</i></li></ol>
<p><i>C'était</i> = fue / era (lo verás en la semana 6). <i>Y</i> = allí.</p>
<p><b>Sesión larga:</b> busca en YouTube un vlog de viaje en francés (por ejemplo de <i>Léna Situations</i>) y apunta 5 verbos en passé composé que oigas.</p>`,
ex:[["L'été dernier, je ___ en Italie. (aller, Martina)",["suis allée"]],["On ___ l'avion. (prendre)",["a pris"]],["Nous ___ des musées. (visiter)",["avons visité"]],["Elles ___ à Rome le matin. (arriver)",["sont arrivées"]],["J'___ mon passeport ! (perdre)",["ai perdu"]],["On ___ beaucoup de pizzas. (manger)",["a mangé"]],["Je ___ trois jours à Florence. (rester, Martina)",["suis restée"]],["Nous ___ à Madrid dimanche. (rentrer, fem.)",["sommes rentrées"]],["___ génial ! (fue)",["c'était"]],["Je veux ___ retourner. (allí)",["y"]]],
prod:"Cuenta un viaje real o imaginario en 100 palabras siguiendo los 5 pasos."},

{id:"4.7", t:"Día 7 · Prueba 1 (semanas 1 a 4)", html:`<p>Primera prueba grande. 24 preguntas de todo lo que has visto. Si aciertas 19 o más, vas muy bien.</p>`,
ex:[["___ amis (artículo indeterminado)",["des"]],["Vous ___ françaises ? (être)",["êtes"]],["Nous ___ un chien. (avoir)",["avons"]],["Ils ___ en anglais. (parler)",["parlent"]],["Negativa: Je comprends. → Je ___.",["ne comprends pas"]],["Il n'y a pas ___ pain.",["de"]],["Femenino de «sportif»",["sportive"]],["Nous ___ tard. (finir)",["finissons"]],["Vous ___ du sport ? (faire)",["faites"]],["Ils ___ le métro. (prendre)",["prennent"]],["___ sœur (mi)",["ma"]],["80 en francés",["quatre-vingts"]],["Elles ___ venir. (pouvoir)",["peuvent"]],["Je ___ tôt. (se lever)",["me lève"]],["Je vais ___ restaurant.",["au"]],["___ hôtel (este)",["cet"]],["un ___ appartement (beau, con vocal)",["bel"]],["Hier, j'___ un film. (voir)",["ai vu"]],["Elle a ___ du sport. (faire)",["fait"]],["Je ___ à Paris. (aller, Martina)",["suis allée"]],["Ils ___ tard. (rentrer)",["sont rentrés"]],["Je n'ai ___ vu la mer. (nunca)",["jamais"]],["Demain, je ___ partir. (voy a)",["vais"]],["Je ___ manger. (acabo de)",["viens de"]]],
prod:"Escribe 120 palabras: preséntate y cuenta lo que hiciste el último fin de semana."}
);

LESSONS.push(
{id:"5.1", t:"Día 1 · Los pronombres COD: le, la, les", html:`
<p>Sustituyen al complemento directo, como «lo, la, los, las»:</p>
<table><tr><th></th><th>Ejemplo</th></tr>
<tr><td><b>le</b> (lo)</td><td>Tu vois le film ? Oui, je <b>le</b> vois.</td></tr>
<tr><td><b>la</b> (la)</td><td>Tu prends la robe ? Oui, je <b>la</b> prends.</td></tr>
<tr><td><b>l'</b> (delante de vocal)</td><td>Je <b>l'</b>aime.</td></tr>
<tr><td><b>les</b> (los, las)</td><td>Tu connais ses amies ? Oui, je <b>les</b> connais.</td></tr></table>
<p>También <b>me, te, nous, vous</b>: <i>Il me regarde. Je t'appelle.</i></p>
<p><b>Van delante del verbo</b>, como en español: <i>Je le vois.</i> Negación: <i>Je ne le vois pas.</i> Con dos verbos, delante del infinitivo: <i>Je vais <b>le</b> regarder.</i></p>`,
ex:[["Tu regardes la série ? Oui, je ___ regarde.",["la"]],["Tu vois ce film ? Oui, je ___ vois.",["le"]],["Tu aimes Hugo ? Oui, je ___ aime.",["l'"]],["Tu connais mes parents ? Oui, je ___ connais.",["les"]],["Il ___ appelle tous les jours. (me, con vocal)",["m'"]],["Je ___ attends ! (te, con vocal)",["t'"]],["Negativa: Je le vois. → Je ___ vois pas.",["ne le"]],["Je vais ___ acheter. (la robe)",["l'"]],["Tu prends ces baskets ? Oui, je ___ prends.",["les"]],["Elle ___ invite à sa fête. (nous)",["nous"]]],
prod:"Escribe 6 preguntas y respuestas con le, la, les sobre ropa: Tu prends cette veste ? Oui, je la prends."},

{id:"5.2", t:"Día 2 · Los pronombres COI: lui y leur", html:`
<p>Sustituyen a «a alguien» (complemento indirecto):</p>
<ul><li><b>lui</b> = le (a él o a ella): <i>Je parle à Léa → Je <b>lui</b> parle.</i></li>
<li><b>leur</b> = les (a ellos o ellas): <i>J'écris à mes parents → Je <b>leur</b> écris.</i></li></ul>
<p>Y <b>me, te, nous, vous</b> igual que en el COD: <i>Tu me donnes ton numéro ?</i></p>
<p>Verbos que llevan <b>à + persona</b>: <i>parler à, téléphoner à, écrire à, répondre à, donner à, offrir à, demander à, dire à</i>. <b>¡Atención!</b> <i>lui</i> sirve para masculino y femenino: <i>Je lui offre un parfum</i> puede ser a él o a ella.</p>`,
ex:[["Je parle à Léa. → Je ___ parle.",["lui"]],["J'écris à mes parents. → Je ___ écris.",["leur"]],["Tu téléphones à Hugo ? Oui, je ___ téléphone.",["lui"]],["Elle offre un cadeau à ses amies. → Elle ___ offre un cadeau.",["leur"]],["Il ___ dit bonjour. (a mí)",["me"]],["Je ___ réponds demain. (a ti)",["te"]],["Je donne le livre à mon frère. → Je ___ donne le livre.",["lui"]],["Negativa: Je lui parle. → Je ___ parle pas.",["ne lui"]],["Tu demandes à tes profs ? Oui, je ___ demande.",["leur"]],["Je vais ___ écrire. (a ella)",["lui"]]],
prod:"¿Qué regalas a tu familia en Navidad? 5 frases con lui y leur."},

{id:"5.3", t:"Día 3 · Y, el «allí»", html:`
<p><b>y</b> sustituye a un lugar (<i>à, en, dans, chez</i> + lugar): <i>Tu vas à Paris ? Oui, j'<b>y</b> vais.</i> = Sí, voy (allí).</p>
<p>También sustituye a <b>à + cosa</b>: <i>Tu penses à ton combat ? Oui, j'y pense.</i></p>
<p>Expresiones fijas muy frecuentes: <b>On y va !</b> (¡vamos!), <b>Vas-y !</b> (¡venga!, ¡dale!), <b>Il y a</b> (hay), <b>J'y suis</b> (ya lo pillo / ya estoy).</p>
<p>Posición igual que los otros pronombres: delante del verbo. <i>Je n'y vais pas. Je vais y aller.</i></p>`,
ex:[["Tu vas à la salle ? Oui, j'___ vais.",["y"]],["Tu habites à Madrid ? Oui, j'___ habite.",["y"]],["On ___ va ! (vamos)",["y"]],["___ -y ! (venga, tú)",["vas"]],["Negativa: J'y vais. → Je ___ vais pas.",["n'y"]],["Tu penses à tes vacances ? Oui, j'___ pense.",["y"]],["Je vais ___ aller demain.",["y"]],["Tu es déjà allée en Thaïlande ? Oui, j'___ suis allée.",["y"]],["Elle va chez le médecin ? Oui, elle ___ va.",["y"]],["Il ___ a un problème. (hay)",["y"]]],
prod:"Escribe 5 lugares a los que vas a menudo y responde con y: Je vais à la salle ? Oui, j'y vais trois fois par semaine."},

{id:"5.4", t:"Día 4 · En, el pronombre de las cantidades", html:`
<p><b>en</b> sustituye a algo introducido por <b>de, du, de la, des</b> o a una cantidad:</p>
<ul><li><i>Tu veux du café ? Oui, j'<b>en</b> veux.</i> (Sí, quiero.)</li>
<li><i>Tu as des frères ? Oui, j'<b>en</b> ai deux.</i> (Tengo dos.)</li>
<li><i>Tu fais de la boxe ? Oui, j'<b>en</b> fais.</i></li>
<li><i>Il y a combien de pages ? Il y <b>en</b> a cent.</i></li></ul>
<p>Con números, el número va al final: <i>J'en ai trois.</i> En español muchas veces no se dice nada, por eso cuesta: acostúmbrate a ponerlo. <b>Expresiones:</b> <i>J'en ai marre</i> (estoy harta), <i>Je m'en fiche</i> (me da igual), <i>Ne t'en fais pas</i> (no te preocupes).</p>`,
ex:[["Tu veux du thé ? Oui, j'___ veux.",["en"]],["Tu as des sœurs ? Oui, j'___ ai une.",["en"]],["Tu fais du sport ? Oui, j'___ fais.",["en"]],["Il y a des pommes ? Oui, il y ___ a.",["en"]],["Negativa: J'en veux. → Je ___ veux pas.",["n'en"]],["Tu manges de la viande ? Non, je n'___ mange pas.",["en"]],["J'___ ai marre ! (estoy harta)",["en"]],["Tu as combien de chats ? J'en ___ deux.",["ai"]],["Elle boit du café ? Oui, elle ___ boit beaucoup.",["en"]],["Je vais ___ acheter. (des fruits)",["en"]]],
prod:"Responde con en: ¿cuántos hermanos, primos, amigos franceses y pares de zapatillas tienes?"},

{id:"5.5", t:"Día 5 · Los pronombres en el pasado y los reflexivos en pasado", html:`
<p>En el passé composé, el pronombre va <b>delante del auxiliar</b>:</p>
<ul><li><i>J'ai vu le film → Je <b>l'</b>ai vu.</i></li><li><i>J'ai parlé à Léa → Je <b>lui</b> ai parlé.</i></li>
<li><i>Je suis allée à Lyon → J'<b>y</b> suis allée.</i></li><li><i>J'ai acheté des fruits → J'<b>en</b> ai acheté.</i></li></ul>
<p><b>Truco avanzado:</b> con <i>le, la, les</i> delante de <i>avoir</i>, el participio concuerda: <i>La robe ? Je l'ai acheté<b>e</b>.</i> (Casi no se oye; es más para escribir bien.)</p>
<p><b>Reflexivos en pasado</b> siempre con être y concordancia: <i>Je me suis levée, tu t'es habillée, il s'est douché, nous nous sommes reposés, elles se sont amusées.</i> Negación: <i>Je ne me suis pas levée tôt.</i></p>`,
ex:[["J'ai vu le film. → Je ___ vu.",["l'ai"]],["J'ai parlé à Léa. → Je ___ parlé.",["lui ai"]],["Je suis allée à Lyon. → J'___ allée.",["y suis"]],["J'ai acheté des fruits. → J'___ acheté.",["en ai"]],["Je ___ à sept heures. (se lever, Martina)",["me suis levée"]],["Il ___ après le sport. (se doucher)",["s'est douché"]],["Elles ___ au concert. (s'amuser)",["se sont amusées"]],["Tu ___ tôt ? (se réveiller, chica)",["t'es réveillée"]],["Negativa: Je me suis levée tôt. → Je ___ levée tôt.",["ne me suis pas"]],["La robe ? Je l'ai ___ . (acheter, concordancia)",["achetée"]]],
prod:"Cuenta tu mañana de ayer con 6 verbos reflexivos en pasado."},

{id:"5.6", t:"Día 6 · Comprar ropa y sesión larga", html:`
<p><b>En una tienda de ropa:</b></p>
<ul><li><i>Je cherche une veste en cuir.</i> · <i>Je regarde, merci.</i> (Solo miro.)</li>
<li><i>Vous l'avez en noir ? En taille M ?</i> · <i>Je fais du 38.</i> (Calzo / uso la 38.)</li>
<li><i>Je peux l'essayer ? Où sont les cabines d'essayage ?</i></li>
<li><i>C'est trop serré / trop large / trop long.</i> · <i>Ça me va bien ?</i> (¿Me queda bien?)</li>
<li><i>C'est combien ? Il y a des soldes ?</i> · <i>Je le prends.</i> (Me lo llevo.)</li></ul>
<p>Falsos amigos de la moda: <i>une robe</i> = un vestido, <i>une chemise</i> = una camisa, <i>large</i> = ancho, <i>une veste</i> = una chaqueta.</p>
<p><b>Sesión larga:</b> mira un vídeo de moda en francés (un «haul» o un «get ready with me») y apunta 8 prendas.</p>`,
ex:[["Je ___ une veste en cuir. (buscar)",["cherche"]],["Je peux l'___ ? (probar)",["essayer"]],["Vous l'avez ___ noir ?",["en"]],["Je fais ___ 38.",["du"]],["C'est trop ___ . (ancho)",["large"]],["Ça me ___ bien ? (quedar)",["va"]],["Une ___ = un vestido",["robe"]],["Une ___ = una camisa",["chemise"]],["Je le ___ . (me lo llevo)",["prends"]],["Les ___ commencent en janvier. (rebajas)",["soldes"]]],
prod:"Escribe el diálogo de una compra de ropa de 10 líneas, con pronombres le, la, les."},

{id:"5.7", t:"Día 7 · Prueba de la semana 5", html:`<p>Pronombres y ropa. Responde sin mirar.</p>`,
ex:[["Tu prends la jupe ? Oui, je ___ prends.",["la"]],["Tu connais mes amis ? Oui, je ___ connais.",["les"]],["Je parle à Hugo. → Je ___ parle.",["lui"]],["J'écris à mes cousins. → Je ___ écris.",["leur"]],["Tu vas à Nice ? Oui, j'___ vais.",["y"]],["Tu veux de l'eau ? Oui, j'___ veux.",["en"]],["Tu as des frères ? Oui, j'en ___ deux.",["ai"]],["J'ai vu Léa. → Je ___ vue.",["l'ai"]],["Je suis allée à Lyon. → J'___ allée.",["y suis"]],["Elle ___ tôt. (se lever)",["s'est levée"]],["Nous ___ . (s'amuser, masc.)",["nous sommes amusés"]],["Je peux l'___ ? (probar)",["essayer"]],["Une ___ = un vestido",["robe"]],["C'est trop ___ . (ajustado)",["serré"]],["On ___ va ! (vamos)",["y"]],["J'___ ai marre ! (estoy harta)",["en"]]],
prod:"Habla de tus estudios o de tu trabajo y de tu estilo en 100 palabras."},

{id:"6.1", t:"Día 1 · El imparfait: las formas", html:`
<p>El <b>imparfait</b> es el «pretérito imperfecto» (hablaba, era, tenía). Se forma con la forma de <b>nous</b> del presente, quitando <i>-ons</i>, y añadiendo:</p>
<table><tr><th></th><th>terminación</th><th>parler (nous parlons)</th><th>faire (nous faisons)</th></tr>
<tr><td>je</td><td>-ais</td><td>parlais</td><td>faisais</td></tr><tr><td>tu</td><td>-ais</td><td>parlais</td><td>faisais</td></tr>
<tr><td>il / elle</td><td>-ait</td><td>parlait</td><td>faisait</td></tr><tr><td>nous</td><td>-ions</td><td>parlions</td><td>faisions</td></tr>
<tr><td>vous</td><td>-iez</td><td>parliez</td><td>faisiez</td></tr><tr><td>ils / elles</td><td>-aient</td><td>parlaient</td><td>faisaient</td></tr></table>
<p>Solo <b>être</b> es irregular: <i>j'<b>ét</b>ais, tu étais, il était, nous étions, vous étiez, ils étaient</i>. <i>-ais, -ait, -aient</i> suenan igual («e»).</p>`,
ex:[["Je ___ français. (parler)",["parlais"]],["Tu ___ du sport. (faire)",["faisais"]],["Il ___ tard. (être)",["était"]],["Nous ___ à Lyon. (habiter)",["habitions"]],["Vous ___ un chien ? (avoir)",["aviez"]],["Ils ___ beaucoup. (manger)",["mangeaient"]],["J'___ timide. (être)",["étais"]],["Elle ___ tous les jours. (s'entraîner)",["s'entraînait"]],["On ___ des séries. (regarder)",["regardait"]],["Elles ___ du café. (boire)",["buvaient"]]],
prod:"¿Cómo eras de pequeña? 6 frases en imparfait: J'étais…, j'habitais…, j'aimais…"},

{id:"6.2", t:"Día 2 · Cuándo se usa el imparfait", html:`
<p>Se usa igual que el imperfecto español:</p>
<ul><li><b>Costumbres del pasado:</b> <i>Quand j'étais petite, je dansais tous les samedis.</i></li>
<li><b>Descripciones</b> (personas, lugares, tiempo): <i>Il faisait beau. La maison était grande.</i></li>
<li><b>Estados y sentimientos:</b> <i>J'avais peur. J'étais contente.</i></li>
<li><b>Una acción en curso</b> interrumpida por otra: <i>Je regardais la télé quand tu as appelé.</i></li></ul>
<p>Expresión muy usada: <b>c'était</b> = fue / era. <i>C'était super ! C'était comment ?</i> (¿Qué tal estuvo?)</p>`,
ex:[["Quand j'___ petite, je jouais au parc. (être)",["étais"]],["Il ___ beau ce jour-là. (faire)",["faisait"]],["J'___ peur du noir. (avoir)",["avais"]],["Nous ___ tous les étés à la mer. (aller)",["allions"]],["La maison ___ très grande. (être)",["était"]],["Je ___ la télé quand tu as appelé. (regarder)",["regardais"]],["___ génial ! (fue)",["c'était"]],["Le concert, c'était ___ ? (qué tal)",["comment"]],["Ils ___ souvent au restaurant. (manger)",["mangeaient"]],["Avant, je ne ___ pas de sport. (faire)",["faisais"]]],
prod:"Describe un verano de tu infancia: dónde estabas, qué tiempo hacía y qué hacías cada día."},

{id:"6.3", t:"Día 3 · ¿Imparfait o passé composé?", html:`
<p>Igual que en español con «hacía» y «hice»:</p>
<table><tr><th>Imparfait (decorado)</th><th>Passé composé (acción)</th></tr>
<tr><td>Describe, cuenta costumbres, estados</td><td>Cuenta hechos concretos, terminados</td></tr>
<tr><td><i>Il pleuvait, j'étais fatiguée…</i></td><td><i>… et soudain, j'ai vu un chat.</i></td></tr></table>
<p>Truco del cine: el imparfait es el <b>decorado</b> de la escena, el passé composé son los <b>acontecimientos</b> que hacen avanzar la historia.</p>
<p><i>Hier soir, il <b>faisait</b> froid et je <b>regardais</b> une série. Tout à coup, mon téléphone <b>a sonné</b>. C'<b>était</b> ma coach : mon combat <b>a été</b> confirmé !</i></p>`,
ex:[["Il ___ (pleuvoir, imparfait) quand je suis sortie.",["pleuvait"]],["Je dormais quand le téléphone ___ . (sonner)",["a sonné"]],["Quand j'étais petite, j'___ au tennis. (jouer, costumbre)",["jouais"]],["Hier, j'___ un super film. (voir, hecho)",["ai vu"]],["La rue ___ vide. (être, descripción)",["était"]],["Soudain, quelqu'un ___ à la porte. (frapper)",["a frappé"]],["Je ___ fatiguée, alors je suis rentrée. (être)",["étais"]],["L'année dernière, je ___ en Grèce. (aller, Martina)",["suis allée"]],["Elle ___ dix ans quand elle a commencé la boxe. (avoir)",["avait"]],["Pendant que je cuisinais, il ___ la table. (mettre, PC)",["a mis"]]],
prod:"Cuenta una anécdota: qué pasaba (imparfait) cuando ocurrió algo inesperado (passé composé)."},

{id:"6.4", t:"Día 4 · Conectores: parce que, donc, mais, pendant que", html:`
<table><tr><th>Para…</th><th>Conectores</th><th>Ejemplo</th></tr>
<tr><td>Causa</td><td>parce que, car, comme</td><td><i>Je reste parce qu'il pleut.</i></td></tr>
<tr><td>Consecuencia</td><td>donc, alors, c'est pourquoi</td><td><i>Il pleut, donc je reste.</i></td></tr>
<tr><td>Oposición</td><td>mais, pourtant, par contre</td><td><i>C'est cher, mais c'est beau.</i></td></tr>
<tr><td>Tiempo</td><td>pendant que, quand, après, avant de</td><td><i>Pendant que je cuisine, il range.</i></td></tr>
<tr><td>Añadir</td><td>et, aussi, en plus, de plus</td><td><i>En plus, c'est gratuit !</i></td></tr></table>
<p><b>Comme</b> al principio de frase = como (causa): <i>Comme il pleuvait, on est restés.</i> <b>Avant de</b> + infinitivo: <i>avant de partir</i> (antes de irme).</p>`,
ex:[["Je reste ___ il pleut. (porque)",["parce qu'","parce que"]],["Il pleut, ___ je reste. (así que)",["donc","alors"]],["C'est cher, ___ c'est beau. (pero)",["mais"]],["___ je cuisine, il range. (mientras)",["pendant que"]],["___ il faisait froid, on est restés. (como)",["comme"]],["Je bois un café ___ partir. (antes de)",["avant de"]],["En ___ , c'est gratuit ! (además)",["plus"]],["Il est fatigué, ___ il continue. (sin embargo)",["pourtant"]],["J'aime la viande. Par ___ , je n'aime pas le poisson. (en cambio)",["contre"]],["Je t'appelle ___ j'arrive. (cuando)",["quand"]]],
prod:"Escribe un párrafo de 6 frases sobre tu semana con al menos 5 conectores distintos."},

{id:"6.5", t:"Día 5 · Contar una noticia", html:`
<p>Las noticias usan sobre todo <b>passé composé</b> para los hechos e <b>imparfait</b> para el contexto. Estructura:</p>
<ol><li><b>Qué y dónde:</b> <i>Hier soir, un incendie a eu lieu dans un immeuble à Lyon.</i></li>
<li><b>Contexto:</b> <i>Il était vingt-deux heures et la plupart des habitants dormaient.</i></li>
<li><b>Qué pasó después:</b> <i>Les pompiers sont arrivés rapidement et ont évacué l'immeuble.</i></li>
<li><b>Consecuencia:</b> <i>Heureusement, il n'y a pas eu de blessés.</i></li></ol>
<p>Vocabulario útil: <i>avoir lieu</i> (tener lugar), <i>selon</i> (según), <i>d'après la police</i>, <i>les autorités</i>, <i>un témoin</i> (testigo), <i>annoncer</i>.</p>`,
ex:[["Un accident a eu ___ hier. (lugar)",["lieu"]],["Il ___ minuit. (être, contexto)",["était"]],["Les pompiers ___ rapidement. (arriver)",["sont arrivés"]],["Il n'y a pas ___ de blessés. (avoir, PC)",["eu"]],["___ la police, c'est un accident. (según)",["selon","d'après"]],["Les habitants ___ . (dormir, contexto)",["dormaient"]],["Le président ___ une nouvelle loi. (annoncer, PC)",["a annoncé"]],["Un ___ a tout vu. (testigo)",["témoin"]],["___ , personne n'est mort. (por suerte)",["heureusement"]],["La grève ___ trois jours. (durer, PC)",["a duré"]]],
prod:"Cuenta en 5 frases una noticia de esta semana (deporte, cine o actualidad)."},

{id:"6.6", t:"Día 6 · Tu primer vídeo para franceses y sesión larga", html:`
<p>Hoy das el salto: vas a ver un vídeo <b>hecho para franceses</b>, no para estudiantes. Elige uno de estos:</p>
<ul><li><b>HugoDécrypte</b>: actualidad explicada para jóvenes, con subtítulos.</li>
<li><b>Léna Situations</b>: vlogs de moda y vida en París.</li>
<li>Un tráiler o una escena de <b>Lupin</b> con subtítulos en francés.</li></ul>
<p><b>Método:</b> 1) míralo una vez sin pausa; 2) una segunda vez parando cada frase que no entiendas; 3) apunta 5 palabras nuevas en tu cuaderno; 4) repite en voz alta tres frases imitando la entonación.</p>
<p>Es normal entender solo un 30-40 %. Lo importante es acostumbrar el oído.</p>`,
ex:[["J'___ une vidéo sur YouTube. (regarder, PC)",["ai regardé"]],["Il ___ très vite. (parler, imparfait)",["parlait"]],["Je n'ai pas tout ___ . (comprendre)",["compris"]],["C'___ intéressant. (être, imparfait)",["était"]],["Les sous-___ en français (subtítulos)",["titres"]],["J'ai ___ cinq mots nouveaux. (noter)",["noté"]],["___ je regardais, je prenais des notes. (mientras)",["pendant que"]],["La vidéo ___ dix minutes. (durer, PC)",["a duré"]],["Je l'ai ___ deux fois. (voir)",["vue"]],["Elle ___ de la mode. (parler, imparfait)",["parlait"]]],
prod:"Resume el vídeo que has visto en 6 frases: de qué hablaba, qué pasaba y qué te ha parecido."},

{id:"7.1", t:"Día 1 · El futur simple", html:`
<p>Se forma con el <b>infinitivo entero</b> + las terminaciones de <i>avoir</i>: <b>-ai, -as, -a, -ons, -ez, -ont</b>.</p>
<table><tr><th></th><th>parler</th><th>finir</th><th>vendre (pierde la -e)</th></tr>
<tr><td>je</td><td>parler<b>ai</b></td><td>finir<b>ai</b></td><td>vendr<b>ai</b></td></tr>
<tr><td>tu</td><td>parleras</td><td>finiras</td><td>vendras</td></tr><tr><td>il / elle</td><td>parlera</td><td>finira</td><td>vendra</td></tr>
<tr><td>nous</td><td>parlerons</td><td>finirons</td><td>vendrons</td></tr><tr><td>vous</td><td>parlerez</td><td>finirez</td><td>vendrez</td></tr>
<tr><td>ils / elles</td><td>parleront</td><td>finiront</td><td>vendront</td></tr></table>
<p>Es como el futuro español: «hablaré». En la conversación diaria se usa mucho más el futuro próximo (<i>je vais parler</i>), pero el futur simple aparece en planes, promesas y predicciones: <i>Un jour, je serai championne.</i></p>`,
ex:[["Je ___ français. (parler)",["parlerai"]],["Tu ___ à quelle heure ? (finir)",["finiras"]],["Elle ___ sa voiture. (vendre)",["vendra"]],["Nous ___ en juillet. (voyager)",["voyagerons"]],["Vous ___ le train ? (prendre)",["prendrez"]],["Ils ___ demain. (arriver)",["arriveront"]],["Je t'___ ce soir. (appeler)",["appellerai"]],["On ___ ensemble. (manger)",["mangera"]],["Elles ___ le match. (regarder)",["regarderont"]],["Je ___ un livre. (lire)",["lirai"]]],
prod:"Escribe 6 promesas para el año que viene en futur simple: Je mangerai mieux, je voyagerai…"},

{id:"7.2", t:"Día 2 · El futuro irregular", html:`
<p>Las terminaciones son siempre las mismas; lo que cambia es la raíz:</p>
<table><tr><th>Verbo</th><th>Raíz</th><th>Ejemplo</th></tr>
<tr><td>être</td><td>ser-</td><td>je serai</td></tr><tr><td>avoir</td><td>aur-</td><td>j'aurai</td></tr>
<tr><td>aller</td><td>ir-</td><td>j'irai</td></tr><tr><td>faire</td><td>fer-</td><td>je ferai</td></tr>
<tr><td>venir</td><td>viendr-</td><td>je viendrai</td></tr><tr><td>pouvoir</td><td>pourr-</td><td>je pourrai</td></tr>
<tr><td>vouloir</td><td>voudr-</td><td>je voudrai</td></tr><tr><td>devoir</td><td>devr-</td><td>je devrai</td></tr>
<tr><td>savoir</td><td>saur-</td><td>je saurai</td></tr><tr><td>voir</td><td>verr-</td><td>je verrai</td></tr></table>
<p>Frases hechas: <i>On verra !</i> (¡ya veremos!), <i>Ce sera génial !</i> Con <b>quand</b> el francés usa futuro donde el español usa subjuntivo: <i>Quand je <b>serai</b> à Paris, je t'appellerai</i> (Cuando esté en París…).</p>`,
ex:[["Je ___ championne. (être)",["serai"]],["Tu ___ vingt ans. (avoir)",["auras"]],["Nous ___ à Paris. (aller)",["irons"]],["Il ___ beau demain. (faire)",["fera"]],["Elle ___ avec nous. (venir)",["viendra"]],["Vous ___ venir ? (pouvoir)",["pourrez"]],["Ils ___ partir tôt. (devoir)",["devront"]],["On ___ ! (voir: ya veremos)",["verra"]],["Je le ___ demain. (savoir)",["saurai"]],["Quand je ___ en France, je parlerai français. (être)",["serai"]]],
prod:"¿Cómo será tu vida dentro de 5 años? 8 frases con futuros irregulares."},

{id:"7.3", t:"Día 3 · Être en train de: lo que pasa ahora", html:`
<p>El francés no tiene gerundio como «estoy comiendo». Para decir que algo está pasando ahora mismo usa <b>être en train de + infinitivo</b>:</p>
<p><i>Je suis en train de manger.</i> = Estoy comiendo. <i>Elle est en train de s'entraîner.</i> = Está entrenando.</p>
<p>Pero muchas veces basta el presente: <i>Qu'est-ce que tu fais ? — Je regarde une série.</i> (¿Qué haces? —Estoy viendo una serie.)</p>
<p>Repaso de las tres «perífrasis» de tiempo:</p>
<ul><li><b>venir de</b> + inf. = acabar de (pasado reciente): <i>Je viens de rentrer.</i></li>
<li><b>être en train de</b> + inf. = estar haciendo (ahora): <i>Je suis en train de cuisiner.</i></li>
<li><b>aller</b> + inf. = ir a (futuro próximo): <i>Je vais sortir.</i></li></ul>`,
ex:[["Je suis en ___ de manger.",["train"]],["Elle est en train ___ s'entraîner.",["de"]],["Nous ___ en train de regarder un film. (être)",["sommes"]],["Je ___ de rentrer. (acabo de)",["viens"]],["Je ___ sortir. (voy a)",["vais"]],["Ils ___ en train de jouer. (être)",["sont"]],["Tu ___ de finir ? (acabas de)",["viens"]],["On ___ commander une pizza. (vamos a)",["va"]],["Elle est en train de ___ . (se maquiller)",["se maquiller"]],["Vous ___ partir ? (ir a)",["allez"]]],
prod:"Escribe qué está haciendo ahora mismo tu familia: Ma mère est en train de…"},

{id:"7.4", t:"Día 4 · Comparar: plus, moins, aussi", html:`
<table><tr><th>Comparación</th><th>Estructura</th><th>Ejemplo</th></tr>
<tr><td>Superioridad</td><td><b>plus</b> + adj. + <b>que</b></td><td><i>Elle est plus grande que moi.</i></td></tr>
<tr><td>Inferioridad</td><td><b>moins</b> + adj. + <b>que</b></td><td><i>C'est moins cher que l'autre.</i></td></tr>
<tr><td>Igualdad</td><td><b>aussi</b> + adj. + <b>que</b></td><td><i>Il est aussi fort que son frère.</i></td></tr>
<tr><td>Con nombres</td><td>plus de / moins de / autant de</td><td><i>J'ai plus de temps que toi.</i></td></tr></table>
<p><b>Irregulares:</b> <i>bon → <b>meilleur</b></i> (mejor, adjetivo): <i>Ce film est meilleur.</i> · <i>bien → <b>mieux</b></i> (mejor, adverbio): <i>Elle danse mieux que moi.</i> · <i>mauvais → pire</i>. ¡Nunca «plus bon»!</p>`,
ex:[["Elle est ___ grande que moi. (más)",["plus"]],["C'est ___ cher que l'autre. (menos)",["moins"]],["Il est ___ fort que son frère. (tan)",["aussi"]],["Ce film est ___ que l'autre. (bon, mejor)",["meilleur"]],["Elle danse ___ que moi. (bien, mejor)",["mieux"]],["J'ai ___ de temps que toi. (más)",["plus"]],["Paris est plus grand ___ Lyon.",["que"]],["Cette série est ___ que la première. (mejor, fem.)",["meilleure"]],["C'est ___ ! (mauvais, peor)",["pire"]],["Il a ___ de livres que moi. (tantos)",["autant"]]],
prod:"Compara dos ciudades, dos series o dos deportes en 6 frases."},

{id:"7.5", t:"Día 5 · El superlativo: le plus, le meilleur", html:`
<p><b>le / la / les + plus / moins + adjetivo</b>: <i>C'est <b>la plus belle</b> ville du monde. C'est <b>le moins cher</b>.</i></p>
<p>Si el adjetivo va detrás del nombre, se repite el artículo: <i>C'est la boxeuse <b>la plus forte</b> du club.</i></p>
<p>«de» = de (lugar o grupo): <i>le plus grand <b>du</b> monde, la meilleure <b>de</b> la classe</i>.</p>
<p><b>Irregulares:</b> <i>le meilleur / la meilleure</i> (el mejor), <i>le mieux</i> (lo mejor, adverbio), <i>le pire</i> (el peor).</p>
<p><b>Intensificadores:</b> <i>très</i> (muy), <i>trop</i> (demasiado, y entre jóvenes también «muy»: <i>c'est trop bien !</i>), <i>super</i> (súper), <i>hyper</i>.</p>`,
ex:[["C'est la ___ belle ville du monde. (más)",["plus"]],["C'est le ___ cher. (menos)",["moins"]],["C'est la boxeuse ___ plus forte du club.",["la"]],["C'est le plus grand ___ monde.",["du"]],["C'est le ___ film de l'année. (mejor)",["meilleur"]],["C'est la ___ actrice. (mejor, fem.)",["meilleure"]],["C'est le ___ épisode. (peor)",["pire"]],["C'est ___ bien ! (muy, coloquial)",["trop"]],["C'est ___ qu'on peut faire. (lo mejor, adverbio)",["le mieux"]],["Elle est la plus rapide ___ la classe.",["de"]]],
prod:"Escribe tus «mejores y peores»: la mejor serie, el peor día de la semana, la ciudad más bonita que conoces…"},

{id:"7.6", t:"Día 6 · Comentar un combate o una serie y sesión larga", html:`
<p><b>Para comentar un combate:</b> <i>Elle a gagné aux points / par KO. Le premier round était difficile. Son coup de pied était incroyable. Elle a très bien défendu. L'arbitre a arrêté le combat.</i></p>
<p><b>Para comentar una serie o peli:</b> <i>Ça parle de…</i> (va de…) · <i>L'histoire se passe à Paris.</i> · <i>Le personnage principal est…</i> · <i>J'ai adoré la fin. Je n'ai pas aimé le dernier épisode.</i> · <i>Je te la conseille !</i> · <i>Sans spoiler…</i></p>

prod:"Comenta tu serie favorita en 100 palabras y cuenta tus planes para Navidad."},

{id:"8.1", t:"Día 1 · El conditionnel", html:`
<p>Se forma con la <b>raíz del futuro</b> + las terminaciones del <b>imparfait</b>: <b>-ais, -ais, -ait, -ions, -iez, -aient</b>.</p>
<table><tr><th></th><th>parler</th><th>être (ser-)</th><th>avoir (aur-)</th><th>pouvoir (pourr-)</th></tr>
<tr><td>je</td><td>parlerais</td><td>serais</td><td>aurais</td><td>pourrais</td></tr>
<tr><td>tu</td><td>parlerais</td><td>serais</td><td>aurais</td><td>pourrais</td></tr>
<tr><td>il / elle</td><td>parlerait</td><td>serait</td><td>aurait</td><td>pourrait</td></tr>
<tr><td>nous</td><td>parlerions</td><td>serions</td><td>aurions</td><td>pourrions</td></tr>
<tr><td>vous</td><td>parleriez</td><td>seriez</td><td>auriez</td><td>pourriez</td></tr>
<tr><td>ils / elles</td><td>parleraient</td><td>seraient</td><td>auraient</td><td>pourraient</td></tr></table>
<p>Es el condicional español: «hablaría». Sirve para deseos (<i>J'aimerais vivre à Paris</i>), hipótesis y cortesía.</p>
<p><b>Si + imparfait → conditionnel:</b> <i>Si j'avais de l'argent, je voyagerais.</i> (Si tuviera dinero, viajaría.) ¡Nunca condicional después de <i>si</i>!</p>`,
ex:[["J'___ vivre à Paris. (aimer)",["aimerais"]],["Tu ___ m'aider ? (pouvoir)",["pourrais"]],["Ce ___ génial ! (être)",["serait"]],["Nous ___ besoin d'aide. (avoir)",["aurions"]],["Vous ___ venir ? (vouloir)",["voudriez"]],["Ils ___ partir. (devoir)",["devraient"]],["Si j'avais le temps, je ___ plus. (voyager)",["voyagerais"]],["Si tu ___ riche, qu'est-ce que tu ferais ? (être)",["étais"]],["À ta place, je ___ oui. (dire)",["dirais"]],["Elle ___ à la plage. (aller)",["irait"]]],
prod:"¿Qué harías si ganaras la lotería? 6 frases con si + imparfait + conditionnel."},

{id:"8.2", t:"Día 2 · Pedir y aconsejar con educación", html:`
<p>El condicional suaviza todo. Compara:</p>
<table><tr><th>Directo</th><th>Educado</th></tr>
<tr><td>Je veux un café.</td><td><b>Je voudrais</b> un café.</td></tr>
<tr><td>Tu peux m'aider ?</td><td><b>Tu pourrais</b> m'aider ?</td></tr>
<tr><td>Vous pouvez répéter ?</td><td><b>Pourriez-vous</b> répéter ?</td></tr>
<tr><td>Je veux savoir…</td><td><b>J'aimerais</b> savoir…</td></tr></table>
<p><b>Para aconsejar:</b> <i>Tu devrais dormir plus.</i> (Deberías.) · <i>À ta place, je prendrais le train.</i> (En tu lugar…) · <i>Il vaudrait mieux réserver.</i> (Sería mejor…) · <i>Je te conseille de…</i></p>
<p>En Francia la cortesía importa mucho: <i>s'il vous plaît, merci, excusez-moi, bonne journée</i> abren muchas puertas.</p>`,
ex:[["Je ___ un thé, s'il vous plaît. (vouloir, educado)",["voudrais"]],["Tu ___ m'aider ? (pouvoir, educado)",["pourrais"]],["___ -vous répéter ? (pouvoir, educado)",["pourriez"]],["J'___ savoir le prix. (aimer, educado)",["aimerais"]],["Tu ___ dormir plus. (devoir, consejo)",["devrais"]],["À ta ___ , je prendrais le train.",["place"]],["Il ___ mieux réserver. (valoir, condicional)",["vaudrait"]],["Je te ___ de partir tôt. (aconsejar)",["conseille"]],["Vous ___ boire de l'eau. (devoir, consejo)",["devriez"]],["Nous ___ une table pour deux. (vouloir, educado)",["voudrions"]]],
prod:"Una amiga quiere empezar muay thai. Dale 6 consejos con tu devrais, à ta place, il vaudrait mieux…"},

{id:"8.3", t:"Día 3 · El imperativo", html:`
<p>Es el presente <b>sin pronombre</b>, en tres personas: <b>tu, nous, vous</b>.</p>
<table><tr><th></th><th>regarder</th><th>finir</th><th>prendre</th></tr>
<tr><td>(tu)</td><td>regarde !</td><td>finis !</td><td>prends !</td></tr>
<tr><td>(nous)</td><td>regardons !</td><td>finissons !</td><td>prenons !</td></tr>
<tr><td>(vous)</td><td>regardez !</td><td>finissez !</td><td>prenez !</td></tr></table>
<p><b>Ojo:</b> los verbos en -er pierden la <b>-s</b> en la forma <i>tu</i>: <i>tu regardes → regarde !</i>, <i>tu vas → va !</i>.</p>
<p><b>Irregulares:</b> <i>être → sois, soyons, soyez</i> · <i>avoir → aie, ayons, ayez</i> · <i>savoir → sache</i>.</p>
<p>Con pronombres va <b>detrás con guion</b>: <i>Regarde-moi ! Écoute-le ! Dépêche-toi !</i> (<i>me → moi, te → toi</i>).</p>`,
ex:[["(tu) ___ ! (regarder)",["regarde"]],["(vous) ___ la porte ! (fermer)",["fermez"]],["(nous) ___ ! (partir)",["partons"]],["(tu) ___ ton manteau ! (prendre)",["prends"]],["(tu) ___ patiente ! (être)",["sois"]],["(vous) ___ confiance ! (avoir)",["ayez"]],["(tu) ___ à la salle ! (aller)",["va"]],["(tu) Dépêche-___ ! (te)",["toi"]],["(tu) Regarde-___ ! (a mí)",["moi"]],["(vous) ___ vos devoirs ! (finir)",["finissez"]]],
prod:"Escribe las 8 instrucciones de tu entrenador o entrenadora en una clase: Mets tes gants ! Lève la garde !"},

{id:"8.4", t:"Día 4 · ¡No lo hagas! El imperativo negativo", html:`
<p>Negativo: <b>ne</b> + imperativo + <b>pas</b>: <i>Ne regarde pas ! Ne partez pas !</i></p>
<p>Con pronombres, en negativo el pronombre vuelve <b>delante</b> y sin guion:</p>
<table><tr><th>Afirmativo</th><th>Negativo</th></tr>
<tr><td>Regarde-le !</td><td>Ne le regarde pas !</td></tr>
<tr><td>Dépêche-toi !</td><td>Ne te dépêche pas !</td></tr>
<tr><td>Dis-moi !</td><td>Ne me dis pas !</td></tr>
<tr><td>Vas-y !</td><td>N'y va pas !</td></tr></table>
<p>Frases muy frecuentes: <i>Ne t'inquiète pas !</i> (¡No te preocupes!) · <i>Ne t'en fais pas !</i> · <i>Ne bouge pas !</i> (¡No te muevas!) · <i>Ne me spoile pas !</i></p>`,
ex:[["Negativo: Regarde ! → ___ regarde pas !",["ne"]],["Negativo: Partez ! → Ne ___ pas !",["partez"]],["Negativo: Regarde-le ! → Ne ___ regarde pas !",["le"]],["Negativo: Dépêche-toi ! → Ne ___ dépêche pas !",["te"]],["Ne t'___ pas ! (inquiéter)",["inquiète"]],["Ne ___ pas ! (bouger, tu)",["bouge"]],["Negativo: Vas-y ! → N'___ va pas !",["y"]],["Negativo: Dis-moi ! → Ne ___ dis pas !",["me"]],["Ne ___ spoile pas ! (me)",["me"]],["Negativo: Mangez ! → Ne ___ pas !",["mangez"]]],
prod:"Escribe 6 consejos para un turista en París: lo que debe hacer y lo que no (imperativo afirmativo y negativo)."},

{id:"8.5", t:"Día 5 · Los relativos: qui, que, où, dont", html:`
<table><tr><th>Relativo</th><th>Uso</th><th>Ejemplo</th></tr>
<tr><td><b>qui</b></td><td>sujeto (va seguido del verbo)</td><td><i>La fille <b>qui</b> parle est ma sœur.</i></td></tr>
<tr><td><b>que / qu'</b></td><td>complemento directo (va seguido de un sujeto)</td><td><i>Le film <b>que</b> j'ai vu est génial.</i></td></tr>
<tr><td><b>où</b></td><td>lugar y también tiempo</td><td><i>La ville <b>où</b> je suis née. Le jour <b>où</b> je t'ai vue.</i></td></tr>
<tr><td><b>dont</b></td><td>sustituye a «de + algo»</td><td><i>Le livre <b>dont</b> je parle.</i> (del que hablo)</td></tr></table>
<p><b>Truco qui / que:</b> si detrás viene un verbo → <i>qui</i>; si viene un sujeto (je, tu, Martina…) → <i>que</i>. Y <i>qui</i> nunca se apostrofa: <i>qui a</i>, no «qu'a».</p>`,
ex:[["La fille ___ parle est ma sœur.",["qui"]],["Le film ___ j'ai vu est génial.",["que"]],["La ville ___ je suis née.",["où"]],["Le livre ___ je parle. (del que)",["dont"]],["C'est l'acteur ___ joue dans Lupin.",["qui"]],["C'est la série ___ je préfère.",["que"]],["Le jour ___ je t'ai vue.",["où"]],["La boxeuse ___ elle admire.",["qu'"]],["Le restaurant ___ on a mangé.",["où"]],["La chose ___ j'ai besoin. (de la que)",["dont"]]],
prod:"Define 6 cosas o personas de tu vida con relativos: Ma meilleure amie, c'est la personne qui…"},

{id:"8.6", t:"Día 6 · Resumir un misterio y sesión larga", html:`
<p>Para resumir una historia de misterio (una serie, un pódcast, un caso real):</p>
<ol><li><b>Situación</b> (imparfait): <i>C'était une nuit d'hiver. Une jeune femme vivait seule dans un vieux manoir.</i></li>
<li><b>El hecho</b> (passé composé): <i>Un matin, elle a disparu.</i></li>
<li><b>La investigación:</b> <i>La police a trouvé des indices : une lettre, des empreintes…</i></li>
<li><b>Hipótesis</b> (conditionnel): <i>Selon certains, elle serait partie à l'étranger.</i></li>
<li><b>Final u opinión:</b> <i>On ne sait toujours pas ce qui s'est passé. À mon avis…</i></li></ol>
<p>El condicional periodístico (<i>elle serait partie</i>) sirve para información <b>no confirmada</b>: «al parecer se habría ido».</p>
<p><b>Sesión larga:</b> escucha 15 minutos de un pódcast de misterio en francés (por ejemplo <i>Affaires sensibles</i> o <i>Hondelatte raconte</i>) o mira el primer episodio de una serie policíaca francesa.</p>`,
ex:[["C'___ une nuit d'hiver. (être, imparfait)",["était"]],["Une femme ___ seule. (vivre, imparfait)",["vivait"]],["Un matin, elle ___ . (disparaître, PC)",["a disparu"]],["La police ___ des indices. (trouver, PC)",["a trouvé"]],["Un ___ = una pista",["indice"]],["Elle ___ partie à l'étranger. (información no confirmada)",["serait"]],["On ne sait pas ce ___ s'est passé.",["qui"]],["La maison ___ elle habitait.",["où"]],["À mon ___ , c'est le voisin.",["avis"]],["L'homme ___ la police cherche. (relativo)",["que"]]],
prod:"Resume una historia de misterio que hayas visto o leído en 120 palabras, siguiendo los 5 pasos."},

{id:"8.7", t:"Día 7 · Prueba 2 (semanas 5 a 8)", html:`<p>Segunda prueba grande. 24 preguntas sobre pronombres, pasado, futuro, condicional, imperativo y relativos.</p>`,
ex:[["Tu prends ce pull ? Oui, je ___ prends.",["le"]],["Je parle à mes parents. → Je ___ parle.",["leur"]],["Tu vas à Lyon ? Oui, j'___ vais.",["y"]],["Tu as des cousins ? Oui, j'___ ai trois.",["en"]],["Elle ___ tôt. (se lever, PC)",["s'est levée"]],["Quand j'étais petite, j'___ timide. (être)",["étais"]],["Il ___ quand je suis sortie. (pleuvoir, imparfait)",["pleuvait"]],["Hier, j'___ un film. (voir)",["ai vu"]],["Je reste ___ il pleut. (porque)",["parce qu'","parce que"]],["Nous ___ en Italie. (aller, futur)",["irons"]],["Je ___ championne. (être, futur)",["serai"]],["Elle est ___ grande que moi. (más)",["plus"]],["C'est le ___ restaurant. (mejor)",["meilleur"]],["Je suis en ___ de lire.",["train"]],["J'___ vivre à Paris. (aimer, condicional)",["aimerais"]],["Tu ___ dormir plus. (devoir, consejo)",["devrais"]],["Si j'avais le temps, je ___ . (voyager)",["voyagerais"]],["(tu) ___ ! (regarder, imperativo)",["regarde"]],["(tu) ___ patiente ! (être)",["sois"]],["Negativo: Dépêche-toi ! → Ne ___ dépêche pas !",["te"]],["La fille ___ chante est ma cousine.",["qui"]],["Le film ___ je préfère.",["que"]],["La ville ___ j'habite.",["où"]],["Le livre ___ je parle. (del que)",["dont"]]],
prod:"Escribe 120 palabras: cuenta un recuerdo de infancia y di qué harías si pudieras volver a ese momento."},

{id:"9.1", t:"Día 1 · Dar tu opinión", html:`
<p><b>Para opinar:</b> <i>À mon avis, … · Selon moi, … · Je pense que … · Je trouve que … · Je crois que … · Pour moi, …</i></p>
<p><b>Para estar de acuerdo:</b> <i>Je suis d'accord (avec toi). · Tu as raison. · Exactement !</i></p>
<p><b>Para no estarlo:</b> <i>Je ne suis pas d'accord. · Tu as tort. · Pas du tout ! · Au contraire…</i></p>
<p><b>Para matizar:</b> <i>Ça dépend. · C'est vrai, mais… · D'un côté…, de l'autre… · Je ne suis pas sûre.</i></p>
<p>Ojo: <i>avis</i> es un falso amigo: significa <b>opinión</b>, no «aviso». <i>Quel est ton avis ?</i> = ¿Qué opinas?</p>`,
ex:[["À mon ___ , c'est une bonne idée.",["avis"]],["Je ___ que tu as raison. (pensar)",["pense"]],["Je ___ que c'est cher. (encontrar = parecer)",["trouve"]],["Je suis d'___ avec toi.",["accord"]],["Tu as ___ ! (razón)",["raison"]],["Tu as ___ . (no tienes razón)",["tort"]],["Pas du ___ ! (en absoluto)",["tout"]],["Ça ___ . (depende)",["dépend"]],["Quel est ton ___ ? (opinión)",["avis"]],["___ moi, c'est trop cher. (según)",["selon"]]],
prod:"¿Las redes sociales son buenas o malas? Da tu opinión en 6 frases con distintas expresiones."},

{id:"9.2", t:"Día 2 · El subjonctif: aprende a reconocerlo", html:`
<p>El <b>subjonctif</b> es el subjuntivo francés. Buena noticia: <b>se usa casi como en español</b> y para el A2 basta con <b>reconocerlo</b> y saber unas cuantas formas.</p>
<p>Formación regular: raíz de <i>ils</i> del presente (<i>ils parl-ent</i>) + <b>-e, -es, -e, -ions, -iez, -ent</b>: <i>que je parle, que tu parles, qu'il parle, que nous parlions, que vous parliez, qu'ils parlent</i>.</p>
<table><tr><th>Irregulares clave</th><th>que je…</th></tr>
<tr><td>être</td><td>sois, sois, soit, soyons, soyez, soient</td></tr>
<tr><td>avoir</td><td>aie, aies, ait, ayons, ayez, aient</td></tr>
<tr><td>faire</td><td>fasse</td></tr><tr><td>aller</td><td>aille</td></tr>
<tr><td>pouvoir</td><td>puisse</td></tr><tr><td>savoir</td><td>sache</td></tr><tr><td>vouloir</td><td>veuille</td></tr></table>`,
ex:[["Il faut que je ___ . (partir: parte)",["parte"]],["Il faut que tu ___ patiente. (être)",["sois"]],["Je veux qu'il ___ beau. (faire)",["fasse"]],["Il faut que nous ___ . (parler)",["parlions"]],["J'espère qu'elle ___ venir. (pouvoir)",["puisse"]],["Il faut que tu ___ chez le médecin. (aller)",["ailles"]],["Je veux que vous ___ confiance. (avoir)",["ayez"]],["Il faut qu'ils ___ . (finir)",["finissent"]],["Il faut que je le ___ . (savoir)",["sache"]],["Bien qu'il ___ tard, je reste. (être)",["soit"]]],
prod:"Escribe 5 cosas que «hace falta que» hagas esta semana: Il faut que je…"},

{id:"9.3", t:"Día 3 · Cuándo aparece el subjonctif", html:`
<p>Aparece después de <b>que</b> en estos casos (casi igual que en español):</p>
<ul><li><b>Obligación:</b> <i>Il faut que tu viennes.</i> (Hace falta que vengas.)</li>
<li><b>Deseo o voluntad:</b> <i>Je veux que tu sois heureuse. J'aimerais que tu viennes.</i></li>
<li><b>Emociones:</b> <i>Je suis contente que tu sois là. J'ai peur qu'il pleuve.</i></li>
<li><b>Ciertos conectores:</b> <i>pour que, bien que, avant que, à condition que</i>.</li></ul>
<p><b>Diferencias con el español:</b> <i>espérer que</i> lleva <b>indicativo</b>: <i>J'espère que tu vas bien</i> (Espero que estés bien). <i>Je pense que</i> también: <i>Je pense qu'il est là</i>. Y <i>après que</i> lleva indicativo.</p>`,
ex:[["Il faut que tu ___ . (venir: viennes)",["viennes"]],["Je veux que tu ___ heureuse. (être)",["sois"]],["Je suis contente que tu ___ là. (être)",["sois"]],["J'espère que tu ___ bien. (aller, indicativo)",["vas"]],["Je pense qu'il ___ là. (être, indicativo)",["est"]],["Je parle lentement pour que tu ___ . (comprendre)",["comprennes"]],["J'ai peur qu'il ___ . (pleuvoir: pleuve)",["pleuve"]],["Bien qu'elle ___ fatiguée, elle s'entraîne. (être)",["soit"]],["Il faut que nous ___ du sport. (faire)",["fassions"]],["Je veux qu'il ___ la vérité. (dire: dise)",["dise"]]],
prod:"Escribe 6 deseos para tus amigos y tu familia: Je veux que…, J'aimerais que…, Il faut que…"},

{id:"9.4", t:"Día 4 · El «on» impersonal", html:`
<p><b>On</b> tiene dos usos:</p>
<ul><li>= <b>nosotros</b> en la conversación: <i>On va au cinéma ?</i></li>
<li>= <b>se / la gente</b> (impersonal): <i>En France, on mange tard. Ici, on parle français. On dit que…</i></li></ul>
<p>Siempre con el verbo en 3.ª persona singular: <i>on <b>est</b>, on <b>a</b>, on <b>fait</b></i>.</p>
<p>El francés usa <i>on</i> donde el español usa «se» impersonal o pasiva refleja: <i>On cherche un vendeur.</i> (Se busca vendedor.) <i>Comment on dit «gracias» en français ?</i> (¿Cómo se dice…?)</p>
<p>Otras fórmulas impersonales: <i>il faut</i> (hay que), <i>il est interdit de</i> (está prohibido), <i>il est possible de</i>.</p>`,
ex:[["En France, ___ mange tard. (se)",["on"]],["On ___ au cinéma ? (aller)",["va"]],["Comment on ___ «gracias» ? (dire)",["dit"]],["On ___ que c'est vrai. (dire)",["dit"]],["On ___ fatigués. (être)",["est"]],["Ici, on ___ français. (parler)",["parle"]],["Il ___ réserver. (hay que)",["faut"]],["Il est ___ de fumer. (prohibido)",["interdit"]],["On ___ un serveur. (buscar)",["cherche"]],["On ___ du sport ensemble ? (faire)",["fait"]]],
prod:"Explica 6 costumbres de España a un francés con on: En Espagne, on dîne à…"},

{id:"9.5", t:"Día 5 · Conectores para argumentar", html:`
<table><tr><th>Función</th><th>Conectores</th></tr>
<tr><td>Ordenar</td><td>d'abord, ensuite, enfin · premièrement, deuxièmement</td></tr>
<tr><td>Añadir</td><td>de plus, en plus, en outre, aussi</td></tr>
<tr><td>Oponer</td><td>mais, cependant, pourtant, par contre, alors que</td></tr>
<tr><td>Conceder</td><td>même si, bien que (+ subj.), malgré</td></tr>
<tr><td>Explicar</td><td>parce que, car, puisque, en effet</td></tr>
<tr><td>Concluir</td><td>donc, en conclusion, en résumé, finalement</td></tr>
<tr><td>Ejemplificar</td><td>par exemple, comme</td></tr></table>
<p><b>Estructura de un texto de opinión:</b> introducción con el tema → <i>d'un côté</i> (ventajas) → <i>de l'autre côté</i> (inconvenientes) → <i>à mon avis</i> → <i>en conclusion</i>.</p>`,
ex:[["___ , je vais présenter le sujet. (primero)",["d'abord"]],["De ___ , c'est gratuit. (además)",["plus"]],["C'est utile. ___ , c'est cher. (sin embargo)",["cependant","pourtant"]],["___ si c'est difficile, je continue. (aunque)",["même"]],["___ la pluie, on sort. (a pesar de)",["malgré"]],["En ___ , le sport est essentiel. (conclusión)",["conclusion"]],["Par ___ , le yoga. (ejemplo)",["exemple"]],["D'un ___ , c'est pratique.",["côté"]],["Il dort ___ que je travaille. (mientras que)",["alors"]],["___ tu es là, aide-moi. (ya que)",["puisque"]]],
prod:"Escribe un párrafo de 8 frases sobre las ventajas y desventajas de vivir en una gran ciudad."},

{id:"9.6", t:"Día 6 · Tu texto de opinión y sesión larga", html:`
<p>Hoy escribes tu primer <b>texto de opinión</b> de 100 palabras, como en el examen DELF A2/B1. Elige un tema:</p>
<ul><li><i>Faut-il interdire les téléphones à l'école ?</i></li>
<li><i>Les réseaux sociaux sont-ils dangereux pour les jeunes ?</i></li>
<li><i>Le sport de combat est-il bon pour les femmes ?</i></li></ul>
<p><b>Plan:</b> 1) Presenta el tema (<i>Aujourd'hui, beaucoup de gens pensent que…</i>). 2) Un argumento a favor con ejemplo. 3) Un argumento en contra. 4) Tu opinión (<i>À mon avis…</i>). 5) Conclusión (<i>En conclusion…</i>).</p>
<p><b>Sesión larga:</b> mira un debate corto en francés (por ejemplo un vídeo de <i>HugoDécrypte</i> sobre un tema social) y apunta los conectores que oigas.</p>`,
ex:[["Aujourd'hui, beaucoup de gens ___ que… (pensar)",["pensent"]],["D'un côté, les réseaux sociaux ___ utiles. (être)",["sont"]],["De l'autre ___ , ils sont dangereux.",["côté"]],["À mon avis, il ___ limiter le temps. (hay que)",["faut"]],["Il faut que les jeunes ___ prudents. (être)",["soient"]],["En ___ , tout dépend de nous.",["conclusion"]],["Par exemple, on ___ apprendre des langues. (poder)",["peut"]],["Je ___ que c'est important. (creer)",["crois"]],["Même ___ c'est difficile…",["si"]],["___ , il faut trouver un équilibre. (por lo tanto)",["donc"]]],
prod:"Escribe tu texto de opinión de 100 palabras sobre uno de los tres temas."},

{id:"10.1", t:"Día 1 · Repaso del presente", html:`
<p>Repaso de los verbos irregulares más usados en presente. Fíjate en los patrones:</p>
<table><tr><th>Verbo</th><th>je</th><th>nous</th><th>ils</th></tr>
<tr><td>être</td><td>suis</td><td>sommes</td><td>sont</td></tr><tr><td>avoir</td><td>ai</td><td>avons</td><td>ont</td></tr>
<tr><td>aller</td><td>vais</td><td>allons</td><td>vont</td></tr><tr><td>faire</td><td>fais</td><td>faisons</td><td>font</td></tr>
<tr><td>venir</td><td>viens</td><td>venons</td><td>viennent</td></tr><tr><td>prendre</td><td>prends</td><td>prenons</td><td>prennent</td></tr>
<tr><td>pouvoir</td><td>peux</td><td>pouvons</td><td>peuvent</td></tr><tr><td>vouloir</td><td>veux</td><td>voulons</td><td>veulent</td></tr>
<tr><td>devoir</td><td>dois</td><td>devons</td><td>doivent</td></tr><tr><td>savoir</td><td>sais</td><td>savons</td><td>savent</td></tr>

<p><b>savoir o connaître?</b> <i>savoir</i> = saber algo o saber hacer (<i>Je sais nager</i>); <i>connaître</i> = conocer personas o lugares (<i>Je connais Paris</i>).</p>`,

{id:"10.2", t:"Día 2 · Repaso del pasado", html:`
<p><b>Passé composé</b> = hechos (avoir o être + participio). <b>Imparfait</b> = decorado, costumbres, estados.</p>
<p>Lista de control:</p>
<ul><li>¿Es un verbo de la «casa» o reflexivo? → <b>être</b> + concordancia.</li>
<li>¿Participio irregular? <i>fait, pris, mis, dit, écrit, vu, lu, bu, eu, été, pu, voulu, dû, su, connu, venu, né, mort, ouvert</i>.</li>
<li>¿Describes o cuentas una costumbre? → <b>imparfait</b>.</li></ul>
<p>Ejemplo: <i>Quand j'<b>avais</b> quinze ans, je <b>faisais</b> de la danse. Un jour, une amie m'<b>a emmenée</b> à un cours de boxe thaï. J'<b>ai adoré</b> et je <b>ne suis jamais retournée</b> à la danse !</i></p>`,
ex:[["Quand j'___ quinze ans… (avoir)",["avais"]],["Je ___ de la danse. (faire, costumbre)",["faisais"]],["Un jour, elle m'___ emmenée. (avoir)",["a"]],["J'___ adoré ! (avoir)",["ai"]],["Je ne ___ jamais retournée. (être)",["suis"]],["Elle est ___ en 2003. (naître)",["née"]],["Nous avons ___ la vérité. (dire)",["dit"]],["Il ___ quand je suis arrivée. (dormir)",["dormait"]],["Ils se ___ amusés. (être)",["sont"]],["J'ai ___ un mail. (écrire)",["écrit"]]],
prod:"Cuenta cómo empezaste a hacer tu deporte o tu afición favorita, mezclando passé composé e imparfait."},

{id:"10.3", t:"Día 3 · Repaso del futuro y del condicional", html:`
<p><b>Futuro próximo</b> (aller + inf.) para lo inmediato o seguro: <i>Je vais manger.</i></p>
<p><b>Futur simple</b> para planes, promesas y predicciones: <i>Je serai championne. Il fera beau.</i></p>
<p><b>Conditionnel</b> para deseos, cortesía, consejos e hipótesis: <i>Je voudrais… Tu devrais… Si j'avais…, je ferais…</i></p>
<p>Fíjate en que el futuro y el condicional tienen <b>la misma raíz</b>: <i>je serai / je serais, j'irai / j'irais, je ferai / je ferais</i>. Solo cambia la terminación (y en la pronunciación casi nada: -ai «e» / -ais «e» abierta).</p>`,
ex:[["Demain, je ___ manger chez Léa. (futuro próximo)",["vais"]],["Un jour, je ___ championne. (être, futur)",["serai"]],["Si j'avais le temps, j'___ en Asie. (aller, cond.)",["irais"]],["Il ___ beau demain. (faire, futur)",["fera"]],["Je ___ un café, s'il vous plaît. (vouloir, cond.)",["voudrais"]],["Tu ___ dormir plus. (devoir, cond.)",["devrais"]],["Nous ___ en juin. (venir, futur)",["viendrons"]],["Ils ___ heureux. (être, cond.)",["seraient"]],["Quand j'___ le temps, je lirai. (avoir, futur)",["aurai"]],["Si tu venais, on ___ la fête. (faire, cond.)",["ferait"]]],
prod:"Escribe 4 planes seguros (futur simple), 4 deseos (conditionnel) y 2 hipótesis con si."},

{id:"10.4", t:"Día 4 · Pronombres dobles: je le lui donne", html:`
<p>Cuando hay dos pronombres juntos, siguen este orden (solo necesitas <b>reconocerlo</b>):</p>
<table><tr><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th></tr>
<tr><td>me, te, nous, vous</td><td>le, la, les</td><td>lui, leur</td><td>y</td><td>en</td></tr></table>
<ul><li><i>Il me donne le livre → Il <b>me le</b> donne.</i> (Me lo da.)</li>
<li><i>Je donne le livre à Léa → Je <b>le lui</b> donne.</i> (Se lo doy.)</li>
<li><i>Je t'offre des fleurs → Je <b>t'en</b> offre.</i></li>
<li><i>Il y a des pommes → Il <b>y en</b> a.</i></li></ul>
<p>Diferencia con el español: «se lo doy» → <i>je <b>le lui</b> donne</i> (primero <i>le</i>, luego <i>lui</i>).</p>`,
ex:[["Il me donne le livre. → Il ___ le donne.",["me"]],["Je donne le livre à Léa. → Je le ___ donne.",["lui"]],["Je donne les clés à mes parents. → Je les ___ donne.",["leur"]],["Tu me prêtes ta veste ? → Tu ___ la prêtes ?",["me"]],["Il y a du pain ? → Il y ___ a.",["en"]],["Je t'offre des fleurs. → Je t'___ offre.",["en"]],["Elle nous montre la photo. → Elle nous ___ montre.",["la"]],["Je dis la vérité à Hugo. → Je ___ lui dis.",["la"]],["Je vous envoie le document. → Je vous ___ envoie.",["l'"]],["Orden correcto: je (lui le / le lui) donne",["le lui"]]],
prod:"Escribe 5 frases sobre regalos de cumpleaños con dos pronombres: Le parfum ? Je le lui ai offert."},

{id:"10.5", t:"Día 5 · Contar una historia", html:`
<p>Herramientas para que una historia suene natural:</p>
<ul><li><b>Empezar:</b> <i>Il était une fois… · Un jour… · L'année dernière… · C'était un samedi soir…</i></li>
<li><b>Hacer avanzar:</b> <i>D'abord… · Ensuite… · Puis… · Après… · Pendant ce temps…</i></li>
<li><b>Sorpresa:</b> <i>Soudain… · Tout à coup… · À ce moment-là…</i></li>
<li><b>Terminar:</b> <i>Finalement… · À la fin… · Depuis ce jour…</i></li></ul>
<p>Tiempos: imparfait para el decorado, passé composé para los hechos, y si quieres anticipar, futur o conditionnel.</p>
<p><b>Truco:</b> añade detalles de los cinco sentidos: <i>il faisait froid, j'entendais la musique, ça sentait le café</i>. Hace la historia viva.</p>`,
ex:[["Il ___ une fois… (érase)",["était"]],["___ , quelqu'un a frappé. (de repente)",["soudain"]],["Tout à ___ , la lumière s'est éteinte.",["coup"]],["À ce moment-___ , j'ai compris.",["là"]],["D'___ , on a mangé. (primero)",["abord"]],["___ , on est sortis. (después)",["ensuite","puis","après"]],["___ , tout s'est bien terminé. (al final)",["finalement"]],["Ça ___ le café. (oler, imparfait)",["sentait"]],["J'___ la musique. (oír, imparfait)",["entendais"]],["Depuis ce ___ , je fais de la boxe.",["jour"]]],
prod:"Escribe una historia corta (120 palabras) que empiece con «C'était un samedi soir…»."},

{id:"10.6", t:"Día 6 · Tu aventura y diez minutos de conversación", html:`
<p>Hoy toca <b>hablar</b>. Diez minutos de conversación real son mejores que una hora de ejercicios.</p>
<ol><li><b>Busca un intercambio:</b> apps como <i>Tandem</i> o <i>HelloTalk</i> (gratis) tienen muchos franceses que aprenden español.</li>
<li><b>Prepara 5 frases</b> sobre ti y 5 preguntas: <i>Tu fais quoi dans la vie ? Tu as vu des séries espagnoles ? Tu fais du sport ?</i></li>
<li><b>Frases salvavidas:</b> <i>Tu peux répéter, s'il te plaît ? · Plus lentement, s'il te plaît. · Comment on dit… ? · Je ne comprends pas.</i></li>
<li><b>Graba</b> una nota de voz de 1 minuto contando tu aventura y escúchala.</li></ol>`,
ex:[["Tu peux ___ , s'il te plaît ? (repetir)",["répéter"]],["Plus ___ , s'il te plaît. (despacio)",["lentement"]],["Comment on ___ «hola» en français ?",["dit"]],["Je ne ___ pas. (comprender)",["comprends"]],["Tu fais ___ dans la vie ? (qué)",["quoi"]],["Je ___ espagnole et j'apprends le français. (être)",["suis"]],["Tu ___ des séries espagnoles ? (voir, PC: as vu)",["as vu"]],["Ça fait combien de temps que tu ___ l'espagnol ? (apprendre)",["apprends"]],["J'___ te parler ! (encantar, PC)",["ai adoré"]],["On se ___ la semaine prochaine ? (parler)",["parle"]]],
prod:"Escribe el guion de tu conversación: 5 frases sobre ti y 5 preguntas para tu compañero."},
